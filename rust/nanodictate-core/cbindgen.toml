# cbindgen configuration for the nanodictate-core C ABI.
#
# The generated header is committed at
# Sources/NanoDictateRustFFI/include/nanodictate_core.h and consumed by the
# Swift bridge through the NanoDictateRustFFI clang target. Regenerate with:
#
#   cbindgen --config rust/nanodictate-core/cbindgen.toml \
#            --crate nanodictate-core \
#            --output Sources/NanoDictateRustFFI/include/nanodictate_core.h \
#            rust/nanodictate-core
#
# CI fails when the committed header differs from a fresh generation
# (see scripts/check-rust-abi.sh).

language = "C"
include_guard = "nanodictate_core"
autogen_warning = "/* Warning: this file is generated by cbindgen. Do not modify manually. */"
include_version = true
documentation = true
usize_is_size_t = true

[export]
# PLACEHOLDER is a non-ASCII string literal that cbindgen cannot emit;
# the placeholder contract lives in the Swift layer and the ABI docs.
# Internal tuning constants and types are not part of the C ABI. Note:
# cbindgen matches associated constants by their short Rust name, not by
# the prefixed C name it emits, so exclude those here.
exclude = [
  "PLACEHOLDER",
  "AudioProfile",
  "NEAR_SILENCE_THRESHOLD",
  "DEFAULT_WINDOW_DURATION",
  "DEFAULT_SPEECH_RMS_THRESHOLD",
  "DEFAULT_SILENCE_RMS_THRESHOLD",
  "DEFAULT_GRACE_PERIOD",
  "DEFAULT_MIN_SPEECH_RUN",
  "DEFAULT_MIN_RECORDING_DURATION",
  "ABSOLUTE_MIN_DB",
  "GATE_MARGIN_DB",
  "FACTOR_REFRESH_SAMPLES",
  "MAX_UP_GAP_DB",
  "FAR_ABOVE_SLOWDOWN",
  "KNEE",
]
