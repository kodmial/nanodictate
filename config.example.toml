# Canonical config. Copied to ~/.config/nanodictate/config.toml on first launch.
# Edit user config, not this file.
# Secrets: placeholders. Provider api_key/api_key_file or env NANODICTATE_API_KEY.
# Env beats api_key_file for active provider only. Failover candidates and roles
# keep their own api_key/api_key_file. Not written to config. Empty base_url/model = adapter defaults.
# STT language hint (empty = Whisper auto-detect, param omitted).
# Explicit value (language = "ru") is forwarded in the request.
language = ""
ui_language = "en"
sounds_enabled = true
timeout_seconds = 120
log_level = "info"
active_provider = "airubiz"

[providers.openai]
name = "OpenAI"
base_url = ""
model = ""
api_key = ""
# api_key_file = "~/.config/nanodictate/keys/openai.txt"

[providers.groq]
name = "Groq"
base_url = ""
model = ""
api_key = ""
# api_key_file = "~/.config/nanodictate/keys/groq.txt"

[providers.cloudflare]
name = "Cloudflare Workers AI"
# Cloudflare: full Workers AI URL (account_id + model in path), e.g.:
# base_url = "https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/run/@cf/openai/whisper-large-v3-turbo"
model = ""
api_key = ""
# No transport for cloudflare: section id = STT adapter, not HTTPTransport.
# Transport is set only for http/gateway/cookie-relay.

[providers.airubiz]
name = "Airubiz"
base_url = "https://api.airubiz.site/v1/audio/transcriptions"
model = "gigaam-v3-ctc-sherpa"
api_key = ""
# Anonymous keyless STT. Default transport: direct.

# Transport examples (uncomment the one you need):
#
# [providers.http-proxy]
# name = "HTTP Proxy example"
# base_url = ""
# model = ""
# api_key = ""
# transport = "http"
# http_proxy = "proxy.example.com:8080"
# proxy_user = ""
# proxy_password = ""
#
# [providers.gateway-provider]
# name = "Gateway example"
# base_url = ""
# model = ""
# api_key = ""
# transport = "gateway"
# proxy_key = ""
# proxy_key_header = "X-Custom-Auth"

# Routing by role (see [routing] in Config.swift).
# final_provider: final pass (chunked and plain path).
# segment_provider: chunked segments only.
# Unset -> role = active_provider. auto_failover ignored on roles.
# Uncomment to enable:
#
# [routing]
# segment_provider = "cloudflare"
# final_provider = "groq"

# Extra top-level options (defaults):
# double_alt_max_interval = 0.4
# undo_max_interval = 2.0
# undo_sound_enabled = true
# chunked = false
# providers = ["groq", "cloudflare"]
# auto_failover = false
# insert_method = "cgevent"
# review_before_insert = false
