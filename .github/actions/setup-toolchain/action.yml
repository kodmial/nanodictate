name: setup-toolchain
description: >-
  Reusable adaptive cached toolchain bootstrap for OpenCode and CI.
  Restores immutable layered caches first, installs only on cache miss,
  validates binaries, and exposes versions/paths. One contract across
  macOS, Linux, and future Windows runners.

inputs:
  enable-opencode:
    description: Restore/install the pinned OpenCode CLI.
    required: false
    default: "false"
  enable-swift:
    description: Configure the pinned Swift toolchain via swift-actions/setup-swift.
    required: false
    default: "true"
  enable-rust:
    description: "'true', 'false', or 'auto' (detect rust-toolchain*/Cargo inputs)."
    required: false
    default: "auto"
  github-token:
    description: Authenticated token for GitHub API metadata when genuinely required.
    required: false
    default: ""
  manifest:
    description: Path to the canonical toolchain manifest.
    required: false
    default: ".github/toolchain.json"

outputs:
  os:
    description: Normalized runner OS (macos, linux, windows).
    value: ${{ steps.keys.outputs.os }}
  arch:
    description: Normalized runner architecture (arm64, x64).
    value: ${{ steps.keys.outputs.arch }}
  cache-schema:
    description: Manifest cache schema generation.
    value: ${{ steps.keys.outputs.cache_schema }}
  opencode-version:
    description: Pinned OpenCode version from the manifest.
    value: ${{ steps.keys.outputs.opencode_version }}
  opencode-cache-hit:
    description: Whether the OpenCode layer restored from cache.
    value: ${{ steps.opencode-restore.outputs.cache-hit }}
  opencode-path:
    description: Directory containing the verified opencode binary.
    value: ${{ steps.opencode-verify.outputs.opencode_path }}
  rust-enabled:
    description: Whether Rust layers were activated.
    value: ${{ steps.keys.outputs.rust_enabled }}
  rust-cache-hit:
    description: Whether the Rust/Cargo cache restored (Swatinem/rust-cache).
    value: ${{ steps.rust-cache.outputs.cache-hit }}
  swiftpm-cache-hit:
    description: Whether the SwiftPM layer restored from cache.
    value: ${{ steps.swiftpm-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Derive layered cache keys
      id: keys
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_ENABLE_RUST: ${{ inputs.enable-rust }}
      run: |
        set -euo pipefail
        MANIFEST="${INPUT_MANIFEST:-.github/toolchain.json}"
        source scripts/toolchain/toolchain.sh
        eval "$(toolchain_compute_keys "$MANIFEST" "." "" "" | sed -e 's/^/EXPORT_/')"
        {
          echo "cache_schema=${EXPORT_CACHE_SCHEMA}"
          echo "os=${EXPORT_TOOLCHAIN_OS}"
          echo "arch=${EXPORT_TOOLCHAIN_ARCH}"
          echo "swift_version=${EXPORT_SWIFT_VERSION}"
          echo "opencode_version=${EXPORT_OPENCODE_VERSION}"
          echo "opencode_key=${EXPORT_OPENCODE_KEY}"
          echo "rust_tools_key=${EXPORT_RUST_TOOLS_KEY}"
          echo "cargo_key=${EXPORT_CARGO_KEY}"
          echo "swiftpm_key=${EXPORT_SWIFTPM_KEY}"
          echo "rust_id=${EXPORT_RUST_ID}"
        } >>"$GITHUB_OUTPUT"
        if [[ "$INPUT_ENABLE_RUST" == "true" ]] || { [[ "$INPUT_ENABLE_RUST" == "auto" ]] && toolchain_has_rust "."; }; then
          echo "rust_enabled=true" >>"$GITHUB_OUTPUT"
        else
          echo "rust_enabled=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Restore OpenCode layer
      id: opencode-restore
      if: inputs.enable-opencode == 'true'
      # Pin actions/cache to a full commit SHA (CWE-829).
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.opencode/bin
        key: ${{ steps.keys.outputs.opencode_key }}
        restore-keys: |
          toolchain-opencode-${{ steps.keys.outputs.cache_schema }}-${{ steps.keys.outputs.os }}-${{ steps.keys.outputs.arch }}-

    - name: Install OpenCode on cache miss
      id: opencode-install
      if: inputs.enable-opencode == 'true' && steps.opencode-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/toolchain/install-opencode.sh --manifest "${{ inputs.manifest }}"

    - name: Verify OpenCode layer
      id: opencode-verify
      if: inputs.enable-opencode == 'true'
      shell: bash
      env:
        EXPECTED: ${{ steps.keys.outputs.opencode_version }}
      run: |
        set -euo pipefail
        BIN_DIR="$HOME/.opencode/bin"
        export PATH="$BIN_DIR:$PATH"
        if ! command -v opencode >/dev/null 2>&1; then
          echo "::error::OpenCode verification failed (source=pinned-install expected=${EXPECTED} status=binary-missing bin_dir=${BIN_DIR}). See the install step for the failing source/status/version."
          exit 1
        fi
        REPORTED="$(opencode --version 2>/dev/null || true)"
        if ! grep -qF "$EXPECTED" <<<"$REPORTED"; then
          echo "::error::OpenCode version mismatch after restore/install (source=cache-or-install expected=${EXPECTED} reported='${REPORTED:-none}'). The corrupt cache entry must age out; a fresh install under the correct key follows."
          exit 1
        fi
        echo "OpenCode verified (expected=${EXPECTED} reported='${REPORTED}')."
        echo "opencode_path=$BIN_DIR" >>"$GITHUB_OUTPUT"
        echo "$BIN_DIR" >>"$GITHUB_PATH"

    - name: Save OpenCode layer
      id: opencode-save
      if: inputs.enable-opencode == 'true' && steps.opencode-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.opencode/bin
        key: ${{ steps.keys.outputs.opencode_key }}

    - name: Setup Swift toolchain
      if: inputs.enable-swift == 'true'
      # Pin swift-actions/setup-swift@v2 to a full commit SHA (CWE-829).
      # The manifest pins Swift 6.1: that swift.org toolchain runs in Swift 5
      # language mode and compiles the tools-version 5.7 manifest, while
      # 5.10.1 crashes its swift-frontend on the macOS 15.5 SDK.
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
      with:
        swift-version: ${{ steps.keys.outputs.swift_version }}

    - name: Restore SwiftPM layer
      id: swiftpm-restore
      if: inputs.enable-swift == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/.cache/org.swift.swiftpm
        key: ${{ steps.keys.outputs.swiftpm_key }}
        restore-keys: |
          toolchain-swiftpm-${{ steps.keys.outputs.cache_schema }}-${{ steps.keys.outputs.os }}-${{ steps.keys.outputs.arch }}-

    - name: Save SwiftPM layer
      if: inputs.enable-swift == 'true' && steps.swiftpm-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/.cache/org.swift.swiftpm
        key: ${{ steps.keys.outputs.swiftpm_key }}

    - name: Setup Rust toolchain
      id: rust-toolchain
      if: steps.keys.outputs.rust_enabled == 'true'
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        source scripts/toolchain/toolchain.sh
        CHANNEL="$(toolchain_manifest_value "$INPUT_MANIFEST" '.tools.rust.channel' 'stable')"
        echo "Installing Rust toolchain (channel=${CHANNEL} profile=minimal)."
        rustup toolchain install "$CHANNEL" --profile minimal --no-self-update
        rustup default "$CHANNEL"

    - name: Restore Rust/Cargo layers
      id: rust-cache
      if: steps.keys.outputs.rust_enabled == 'true'
      # Swatinem/rust-cache provides correct lockfile/toolchain keying and
      # target-directory pruning; a custom reimplementation would be inferior.
      # prefix-key carries the manifest cache schema so intentional mass
      # invalidation works; shared-key keeps the key stable across jobs.
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        prefix-key: ${{ steps.keys.outputs.cache_schema }}-rust
        shared-key: ${{ steps.keys.outputs.os }}-${{ steps.keys.outputs.arch }}
        key: ${{ steps.keys.outputs.cargo_key }}
        cache-bin: "true"

    - name: Restore Rust tool binaries (cbindgen)
      id: rust-tools-restore
      if: steps.keys.outputs.rust_enabled == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/bin
        key: ${{ steps.keys.outputs.rust_tools_key }}
        restore-keys: |
          toolchain-rust-tools-${{ steps.keys.outputs.cache_schema }}-${{ steps.keys.outputs.os }}-${{ steps.keys.outputs.arch }}-

    - name: Install pinned Rust tools on cache miss
      if: steps.keys.outputs.rust_enabled == 'true' && steps.rust-tools-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        source scripts/toolchain/toolchain.sh
        CBINDGEN="$(toolchain_manifest_value "$INPUT_MANIFEST" '.tools.cbindgen.version' '')"
        if [[ -n "$CBINDGEN" ]]; then
          echo "Installing pinned cbindgen (expected=${CBINDGEN} source=crates.io)."
          cargo install --locked --version "$CBINDGEN" cbindgen
          cbindgen --version
        else
          echo "No cbindgen version pinned; skipping tool install."
        fi

    - name: Save Rust tool binaries (cbindgen)
      if: steps.keys.outputs.rust_enabled == 'true' && steps.rust-tools-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/bin
        key: ${{ steps.keys.outputs.rust_tools_key }}
