name: Release notes

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'Sources/NanoDictateCore/Version.swift'
      - 'release-please-config.json'
      - 'scripts/release-notes.sh'
      - 'scripts/test-release-notes.sh'
      - 'scripts/release-policy.sh'
      - 'scripts/test-release-policy.sh'
      - 'docs/release-notes.md'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/nanodictate-release-engine.yml'
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'Sources/NanoDictateCore/Version.swift'
      - 'release-please-config.json'
      - 'scripts/release-notes.sh'
      - 'scripts/test-release-notes.sh'
      - 'scripts/release-policy.sh'
      - 'scripts/test-release-policy.sh'
      - 'docs/release-notes.md'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/nanodictate-release-engine.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Canonical release-note regression suite
        run: bash scripts/test-release-notes.sh
      - name: Release-policy regression suite
        run: bash scripts/test-release-policy.sh
      - name: Version and canonical-section gate
        run: |
          set -euo pipefail
          source scripts/release-notes.sh
          SWIFT_VERSION=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' Sources/NanoDictateCore/Version.swift)
          FIRST=$(release_notes_first_version < CHANGELOG.md)
          if [[ "$FIRST" != "$SWIFT_VERSION" ]]; then
            echo "::error::Version.swift ($SWIFT_VERSION) disagrees with CHANGELOG first release header ($FIRST)."
            exit 1
          fi
          # The current version section is the canonical release body: it must
          # exist and must not be header-only (the v0.1.7 failure mode).
          release_notes_gate_publish "$SWIFT_VERSION" "$SWIFT_VERSION" 1 < CHANGELOG.md
          # Body-equivalence enforcement: the exact bytes published as the
          # GitHub Release body must equal the canonical section (byte or
          # normalized equality). Exercise the body-file path here so a
          # regression in the equivalence check fails CI before publication.
          BODY_FILE=$(mktemp)
          release_notes_extract_section "$SWIFT_VERSION" < CHANGELOG.md > "$BODY_FILE"
          release_notes_gate_publish "$SWIFT_VERSION" "$SWIFT_VERSION" 1 "$BODY_FILE" < CHANGELOG.md
          rm -f "$BODY_FILE"
          echo "Canonical section ## [$SWIFT_VERSION] passes the publication gate."
