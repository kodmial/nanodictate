name: macOS 12 compat

# Repeatable compatibility gate for the oldest supported macOS major version.
# Static floor checks run on hosted macos-15 (no runtime claim). Actual macOS 12
# runtime validation (--full) runs on an isolated macOS 12 machine or VM
# OUTSIDE GitHub Actions: since September 23, 2026 runners use Node 24 for
# JavaScript actions, Node 20 is no longer available, and Node 24 is
# incompatible with macOS 13.4 and earlier, so no `uses:` action (checkout,
# upload-artifact, ...) can execute on a macOS 12 host. Every Actions job below
# therefore runs on a supported hosted runner; the isolated macOS 12 run is
# performed out-of-band and its results are collected back on the supported
# runner (see docs/compatibility/macos-12-validation.md).
#
# A newer runner is never treated as equivalent: --full refuses non-12 hosts
# unless --allow-non12-runtime is given, and that diagnostics-only path never
# counts as a release pass.
#
# Security: no secrets are requested or inherited (contents: read only), no
# STT network calls, and every Actions job runs on hosted runners, so fork PRs
# are safe by construction (no self-hosted execution). Manual TCC/UI checks are
# documented in docs/compatibility/macos-12-validation.md.

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'rust/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - '.github/workflows/macos-12-compat.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'rust/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - '.github/workflows/macos-12-compat.yml'
  schedule:
    # Weekly canary (Monday 04:23 UTC): proves the floor still holds even
    # without code changes (runner-image drift, toolchain drift).
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Keep only the newest compatibility run for a PR/ref so stale heads never
# queue ahead of the current commit.
concurrency:
  group: macos12-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-gate:
    name: static floor (hosted)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test macOS 12 compatibility contract
        run: bash scripts/test-macos12-compat-check.sh
      - name: Static macOS 12 floor checks
        run: bash scripts/macos12-compat-check.sh --static-only
      - name: Upload static results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos12-static-${{ github.run_id }}
          path: .opencode-tmp/macos12-compat-results/
          if-no-files-found: warn

  runtime-gate:
    name: runtime qualification (requires actual macOS 12)
    # Supported host only. JavaScript actions require Node 24 (Node 20 was
    # removed on September 23, 2026) and Node 24 cannot run on macOS 13.4 or
    # earlier, so checkout/upload-artifact cannot execute on macOS 12. The
    # --full runtime probe runs on an isolated macOS 12 machine or VM
    # out-of-band; this job records the handoff and collects results back on
    # the supported runner instead of pretending a newer host is equivalent.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare isolated macOS 12 runtime handoff
        run: |
          bash -n scripts/macos12-compat-check.sh
          bash scripts/macos12-compat-check.sh --help >/dev/null
          mkdir -p .opencode-tmp/macos12-compat-results
          {
            echo "result=needs-macos12-host"
            echo "runtime_claim=none"
            echo "reason=actions-host-is-supported-only-node24"
          } > .opencode-tmp/macos12-compat-results/result.txt
          echo "Recorded handoff marker: run scripts/macos12-compat-check.sh --full on an isolated macOS 12 host, then collect the results back on this supported runner."
          echo "See docs/compatibility/macos-12-validation.md."
      - name: Summarize runtime handoff
        if: always()
        run: |
          {
            echo "## macOS 12 runtime gate"
            echo ""
            echo "Actions host is macos-15 (supported). Actual macOS 12 execution happens on an isolated host/VM out-of-band."
            echo ""
            cat .opencode-tmp/macos12-compat-results/result.txt 2>/dev/null || echo "result.txt missing"
            echo ""
            echo "To validate: run scripts/macos12-compat-check.sh --full on isolated macOS 12 hardware or a VM, then collect .opencode-tmp/macos12-compat-results/ back on a supported machine. See docs/compatibility/macos-12-validation.md."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime handoff results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos12-runtime-${{ github.run_id }}
          path: .opencode-tmp/macos12-compat-results/
          if-no-files-found: warn

      # A successful artifact upload confirms only that the handoff ran, not
      # that anything executed on Monterey. An unverified runtime must make
      # the overall workflow red; the static-floor job remains independently
      # visible as green. Never convert needs-macos12-host into a PASS.
      - name: Require verified real macOS 12 execution
        shell: bash
        run: |
          set -euo pipefail
          result=.opencode-tmp/macos12-compat-results/result.txt
          environment=.opencode-tmp/macos12-compat-results/environment.txt
          if [ -f "$result" ] && [ -f "$environment" ] &&
             grep -Fxq 'result=full-green' "$result" &&
             grep -Fxq 'runtime_claim=macos-12' "$result" &&
             grep -Fxq 'macos_major=12' "$environment"; then
            echo 'Real macOS 12 runtime result present. Manual TCC/UI checks remain separate.'
          else
            echo '::error title=macOS 12 runtime is NOT validated::The hosted macOS 15 handoff is not macOS 12 validation. Execute scripts/macos12-compat-check.sh --full on a real isolated macOS 12 host and securely import the result for this exact source revision. Until then this runtime gate is intentionally failing.'
            exit 1
          fi
