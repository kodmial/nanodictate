name: OpenCode agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode"
        required: true
        type: string
      pr_number:
        description: "Pull request number"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch"
        required: false
        type: string
      review_id:
        description: "Source CodeRabbit review id"
        required: false
        type: string
      run_id:
        description: "Source CI workflow run id"
        required: false
        type: string

permissions: {}

jobs:
  dispatch-coderabbit-fix:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch OpenCode for CodeRabbit findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/opencode.yml/dispatches" \
            -f ref=main \
            -f "inputs[mode]=coderabbit-fix" \
            -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[head_ref]=${HEAD_REF}" \
            -f "inputs[review_id]=${REVIEW_ID}"

  opencode:
    # Manual invocations remain owner-only. Automated repair modes arrive via
    # internal workflow_dispatch events from trusted workflows on main.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["coderabbit-fix","resolve-conflict","ci-fix"]'), inputs.mode)) ||
      ((github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment') &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    concurrency:
      group: opencode-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history is required for conflict-repair merges against main.
          fetch-depth: 0
          # Use the repository PAT rather than github.token. OpenCode may need
          # to push changes under .github/workflows/**; the installation token
          # is rejected by GitHub for those updates without workflows access.
          # TAP_PAT must be a classic PAT with repo + workflow scopes.
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          ref: ${{ inputs.head_ref || github.ref }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          # use_github_token=true below tells OpenCode to use this exact env
          # credential for GitHub API operations. Keep it aligned with the
          # checkout credential so both gh calls and git push use TAP_PAT.
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false

      - name: Fix CodeRabbit review findings
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coderabbit-fix'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Fix the actionable CodeRabbit review feedback on pull request #${{ inputs.pr_number }}.

            Context:
            - CodeRabbit submitted review id ${{ inputs.review_id }} with CHANGES_REQUESTED.
            - The current checkout is the existing PR head branch: ${{ inputs.head_ref }}.
            - Inspect that CodeRabbit review, its inline review comments, the PR conversation,
              and the current diff using GitHub CLI/API as needed.

            Requirements:
            - Address every actionable finding from that CodeRabbit review.
            - Keep fixes scoped to the review feedback; do not make unrelated refactors.
            - Run the relevant tests, linters, or validation for the files you change.
            - Commit and push fixes to the current PR branch so the existing PR is updated.
            - Do not create a new pull request.
            - If a finding is incorrect or no longer applicable, do not make a speculative
              code change; explain the reason in the existing PR conversation.
            - Do not resolve or dismiss CodeRabbit review threads yourself. CodeRabbit will
              independently verify every original finding after this repair step completes.
            - If no actionable findings remain, leave the code unchanged.

      - name: Ask CodeRabbit to verify every original finding
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coderabbit-fix'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ inputs.review_id }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const reviewId = Number(process.env.REVIEW_ID);

            if (!Number.isInteger(pullNumber) || !Number.isInteger(reviewId)) {
              core.setFailed('Invalid pull request number or CodeRabbit review id.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const headSha = pr.data.head.sha;

            const comments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }
            );

            const findings = comments.filter(
              (comment) =>
                comment.pull_request_review_id === reviewId &&
                comment.user?.login === 'coderabbitai[bot]' &&
                !comment.in_reply_to_id
            );

            if (findings.length === 0) {
              core.setFailed(
                `CodeRabbit review ${reviewId} has no inline findings to verify.`
              );
              return;
            }

            let requested = 0;
            for (const finding of findings) {
              const marker =
                `<!-- opencode-coderabbit-verification review=${reviewId} finding=${finding.id} head=${headSha} -->`;

              const duplicate = comments.some(
                (comment) =>
                  comment.in_reply_to_id === finding.id &&
                  comment.body?.includes(marker)
              );
              if (duplicate) {
                core.info(
                  `Verification already requested for finding ${finding.id} at ${headSha}.`
                );
                continue;
              }

              const body = [
                marker,
                '@coderabbitai Re-check this exact original finding after the OpenCode fixes.',
                '',
                `Current PR HEAD: \`${headSha}\``,
                '',
                'Compare the original finding in this thread with the current code itself,',
                'not merely with the latest incremental diff or the OpenCode report.',
                '',
                'Reply with **RESOLVED** only if the underlying issue is fully fixed.',
                'Otherwise reply with **UNRESOLVED** and state exactly what remains.',
              ].join('\n');

              await github.request(
                'POST /repos/{owner}/{repo}/pulls/{pull_number}/comments/{comment_id}/replies',
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  comment_id: finding.id,
                  body,
                }
              );
              requested += 1;
            }

            core.notice(
              `Requested CodeRabbit verification for ${requested}/${findings.length} findings from review ${reviewId} at HEAD ${headSha}.`
            );

      - name: Resolve merge conflict with main
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resolve-conflict'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Resolve the merge conflict between pull request #${{ inputs.pr_number }} and the current main branch.

            Context:
            - The current checkout is the existing PR head branch: ${{ inputs.head_ref }}.
            - This workflow was dispatched only after GitHub reported that the PR cannot
              be updated cleanly from main.

            Requirements:
            - Fetch the current origin/main and merge it into the current PR branch.
            - Resolve every merge conflict while preserving the intended behavior from both
              the PR and main; do not discard unrelated changes from either side.
            - Do not rebase, force-push, reset away either side, or create a new pull request.
            - Run the relevant tests, linters, or validation after resolving the conflicts.
            - Commit the merge/conflict resolution and push it to the current PR branch.
            - Keep all comments and commit messages in English.

      - name: Fix failed CI
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-fix'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Fix the failed CI for pull request #${{ inputs.pr_number }}.

            Context:
            - The current checkout is the existing PR head branch: ${{ inputs.head_ref }}.
            - The failed CI workflow run id is ${{ inputs.run_id }}.
            - Inspect that run, its failed jobs and logs using GitHub CLI/API before changing code.

            Requirements:
            - Identify the concrete CI failure from the workflow logs and fix its root cause.
            - Keep the change scoped to the failure; do not make unrelated refactors.
            - If the failure is clearly transient or external infrastructure, do not make a
              speculative code change; explain the reason in the existing PR conversation.
            - Run the relevant tests, linters, or validation locally in the runner when practical.
            - Commit and push any required fix to the current PR branch so the existing PR updates.
            - Do not create a new pull request.
            - Keep all comments and commit messages in English.

      - name: Clear conflict-repair lock
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'resolve-conflict'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/opencode-conflict-repair" \
            >/dev/null 2>&1 || true
