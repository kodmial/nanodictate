name: OpenCode agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode"
        required: true
        type: string
      pr_number:
        description: "Pull request number"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch"
        required: false
        type: string
      review_id:
        description: "Source CodeRabbit review id"
        required: false
        type: string
      run_id:
        description: "Source CI workflow run id"
        required: false
        type: string

permissions: {}

jobs:
  dispatch-coderabbit-fix:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch OpenCode for CodeRabbit findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/dispatches" \
            -f ref=main \
            -f "inputs[mode]=coderabbit-fix" \
            -f "inputs[pr_number]=$PR_NUMBER" \
            -f "inputs[head_ref]=$HEAD_REF" \
            -f "inputs[review_id]=$REVIEW_ID"

  opencode:
    # Manual invocations remain owner-only. Automated repair modes arrive via
    # internal workflow_dispatch events from trusted workflows on main.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.mode == 'coderabbit-fix' ||
        inputs.mode == 'resolve-conflict' ||
        inputs.mode == 'ci-fix')) ||
      ((github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment') &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      issues: write
      pull-requests: write

    concurrency:
      group: opencode-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Conflict repair needs full history to merge the current main branch.
          fetch-depth: 0
          # TAP_PAT is used instead of github.token because OpenCode may update
          # files under .github/workflows/** and must trigger subsequent workflows.
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          ref: ${{ inputs.head_ref || github.ref }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false

      - name: Fix CodeRabbit review findings
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coderabbit-fix'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Fix the actionable CodeRabbit review feedback on pull request #${{ inputs.pr_number }}.

            Context:
            - CodeRabbit submitted review id ${{ inputs.review_id }} with CHANGES_REQUESTED.
            - The current checkout is the existing PR head branch: ${{ inputs.head_ref }}.
            - Inspect that CodeRabbit review, its inline review comments, the PR conversation,
              and the current diff using GitHub CLI/API as needed.

            Requirements:
            - Address every actionable finding from that CodeRabbit review.
            - Keep fixes scoped to the review feedback; do not make unrelated refactors.
            - Run the relevant tests, linters, or validation for the files you change.
            - Commit and push fixes to the current PR branch so the existing PR is updated.
            - Do not create a new pull request.
            - If a finding is incorrect or no longer applicable, do not make a speculative
              code change; explain the reason in the existing PR conversation.
            - If no actionable findings remain, leave the code unchanged.

      - name: Prepare merge with current main
        id: conflict_merge
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resolve-conflict'
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail

          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "PR branch already contains current main."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e

          if [[ $rc -eq 0 ]]; then
            git commit -m "chore: sync main into OpenCode PR branch"
            git push origin "HEAD:$HEAD_REF"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Main merged cleanly without invoking the LLM."
            exit 0
          fi

          unmerged=$(git diff --name-only --diff-filter=U)
          if [[ -z "$unmerged" ]]; then
            echo "::error::Merge failed but Git reports no unmerged paths."
            exit 1
          fi

          echo "conflict=true" >> "$GITHUB_OUTPUT"
          echo "Real merge conflicts prepared for OpenCode:"
          printf '%s\n' "$unmerged"

      - name: Resolve real merge conflicts with OpenCode
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'resolve-conflict' &&
          steps.conflict_merge.outputs.conflict == 'true'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Resolve the existing merge conflicts between pull request #${{ inputs.pr_number }} and main.

            The workflow has already fetched current main and attempted the real merge.
            The worktree now contains the actual conflict state and conflict markers.

            Requirements:
            - Resolve every unmerged path while preserving the intended behavior from both sides.
            - Do not abort the merge, rebase, force-push, reset away either side, or create a new PR.
            - Remove all conflict markers and verify that no unmerged paths remain.
            - Run the relevant tests and linters.
            - Commit the completed merge and push it to the current PR branch.
            - Keep all comments and commit messages in English.

      - name: Fix failed CI
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-fix'
        uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: |
            Fix the failed CI for pull request #${{ inputs.pr_number }}.

            Context:
            - The current checkout is the existing PR head branch: ${{ inputs.head_ref }}.
            - The failed CI workflow run id is ${{ inputs.run_id }}.
            - Inspect that run, its failed jobs and logs using GitHub CLI/API before changing code.

            Requirements:
            - Identify the concrete CI failure from the workflow logs and fix its root cause.
            - Keep the change scoped to the failure; do not make unrelated refactors.
            - If the failure is clearly transient or external infrastructure, do not make a
              speculative code change; leave a concise explanation in the existing PR conversation.
            - Run the relevant tests, linters, or validation locally in the runner when practical.
            - Commit and push any required fix to the current PR branch so the existing PR updates.
            - Do not create a new pull request.
            - Keep all comments and commit messages in English.
