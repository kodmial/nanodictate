name: Continuum agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "issue, resolve-conflict, ci-fix, or review-fix"
        required: true
        type: string
      issue_number:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      head_ref:
        required: false
        type: string
      run_id:
        required: false
        type: string
      rungs_ruled_out:
        required: false
        type: string

permissions: {}

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    uses: kodmial/continuum/.github/workflows/consumer-opencode.yml@2ee9c8703676f6ae009f9a58912893633902b026
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      continuum_token: ${{ secrets.TAP_PAT }}
    with:
      mode: ${{ github.event_name == 'issue_comment' && 'issue' || inputs.mode }}
      issue_number: ${{ github.event_name == 'issue_comment' && github.event.issue.number || inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ inputs.head_ref }}
      run_id: ${{ inputs.run_id }}
      rungs_ruled_out: ${{ inputs.rungs_ruled_out }}
      runner: macos-15
      swift_version: "6.1"
      model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
