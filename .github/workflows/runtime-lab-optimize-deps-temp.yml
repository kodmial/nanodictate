name: Optimize runtime-lab dependency DAG

on:
  push:
    paths:
      - '.github/workflows/runtime-lab-optimize-deps-temp.yml'

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Optimize native dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          add_blocker() {
            local issue="$1" blocker_id="$2"
            printf '{"issue_id":%s}' "$blocker_id" | \
              gh api --method POST \
                "repos/kodmial/runtime-lab/issues/$issue/dependencies/blocked_by" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                --input - >/dev/null 2>&1 || true
          }

          remove_blocker() {
            local issue="$1" blocker_id="$2"
            gh api --method DELETE \
              "repos/kodmial/runtime-lab/issues/$issue/dependencies/blocked_by/$blocker_id" \
              -H "X-GitHub-Api-Version: 2026-03-10" >/dev/null 2>&1 || true
          }

          # #5 can be implemented in parallel with the live smoke test.
          remove_blocker 5 5608741195

          # #6 is the temporary E2E gate and therefore waits for both write-back and smoke.
          add_blocker 6 5608741195

          # Persistent controller can start as soon as runner + harness primitives exist.
          remove_blocker 10 5608548349
          add_blocker 10 5608547647
          add_blocker 10 5608547951

          # Cutover waits for both controller auth/write-back and temporary E2E proof.
          add_blocker 12 5608548349
