name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    # macos-latest now tracks macOS 26 (Xcode 26.x), whose SDK's .swiftinterface
    # syntax is too new for the Swift 5.10.1 toolchain we pin below (SwiftPM
    # manifest compilation crashes). macos-15 ships Xcode 16.4 with an SDK
    # Swift 5.10.1 can parse; pin both the runner and the Xcode version.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          # Package manifest is swift-tools-version:5.7 and the code is Swift 5
          # throughout. Pin a recent 5.x toolchain: the macOS 15.5 SDK shipped
          # with Xcode 16.4 keeps the Swift 5 language mode and is parseable.
          swift-version: "5.10.1"
          xcode-version: "16.4"

      # Форматтер — swift-format (Apple) из стандартного места установки, как
      # локально: /usr/local/bin/swift-format (Homebrew). Без сборки
      # из исходников и без файлов в /tmp.
      - name: Install swift-format
        run: brew install swift-format

      - name: Run swift-format lint
        run: swift-format lint --recursive --configuration .swift-format Sources

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint Sources

      - name: Build
        run: swift build

      # The tests are a plain executable product (no .xctest bundle): without
      # Xcode, `swift test` is unavailable, so `swift run` executes the custom
      # runner (Tests/NanoDictateCoreTests/main.swift), which exits non-zero if
      # any test fails.
      - name: Run tests
        run: swift run NanoDictateCoreTests