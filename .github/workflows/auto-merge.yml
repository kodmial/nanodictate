name: Continuum merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI", "Packaging smoke"]
    types: [completed]
  status:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: continuum-nanodictate-merge
  cancel-in-progress: false

jobs:
  merge:
    uses: kodmial/continuum/.github/workflows/consumer-auto-merge.yml@2ee9c8703676f6ae009f9a58912893633902b026
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    secrets:
      continuum_token: ${{ secrets.TAP_PAT }}
    with:
      config_path: .github/continuum.yml
      ci_workflow: CI
      additional_blocking_workflows: "Packaging smoke"
      scheduler_workflow: issue-scheduler.yml
      release_workflow: release.yml
