name: Continuum repair

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["Continuum agent", "CI", "Packaging smoke"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: continuum-nanodictate-repair-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    uses: kodmial/continuum/.github/workflows/consumer-repair.yml@2ee9c8703676f6ae009f9a58912893633902b026
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    with:
      opencode_workflow: opencode.yml
      ci_workflow: CI
      additional_blocking_workflows: "Packaging smoke"
      scheduler_workflow: issue-scheduler.yml
      max_attempts: ${{ fromJSON(vars.AUTOMATION_MAX_DISPATCH_ATTEMPTS || '3') }}
