name: Check runtime-lab merge constraints

on:
  push:
    paths:
      - '.github/workflows/check-runtime-lab-merge-constraints-temp.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Inspect protection and merge settings
        shell: bash
        run: |
          set -euo pipefail

          echo "repo:"
          gh api repos/kodmial/runtime-lab             --jq '{default_branch,allow_merge_commit,allow_squash_merge,allow_rebase_merge,delete_branch_on_merge}'

          echo "main_protection:"
          status=0
          protection="$(gh api repos/kodmial/runtime-lab/branches/main/protection 2>&1)" || status=$?
          if (( status == 0 )); then
            jq '{required_status_checks,enforce_admins,required_pull_request_reviews,restrictions,required_linear_history,allow_force_pushes,allow_deletions,block_creations,required_conversation_resolution,lock_branch}' <<<"$protection"
          else
            if grep -q '"status":"404"' <<<"$protection" || grep -q 'Branch not protected' <<<"$protection"; then
              echo '{"protected":false}'
            else
              printf '%s\n' "$protection"
              exit "$status"
            fi
          fi
