name: Configure Continuum review provider

# NanoDictate's explicitly selected reviewer is CodeRabbit.
# PR-Agent is not a fallback for CodeRabbit quota or CI issues.
# This repo-local preference must not be rewritten by generic Continuum upgrades.
on:
  workflow_dispatch:
  schedule:
    # Safety-net recovery if another actor changed the GitHub variable directly.
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-continuum-review-provider.yml

permissions:
  actions: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set and verify repository variable
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::TAP_PAT is required to provision repository Variables"; exit 2; }
          gh variable set CONTINUUM_REVIEW_PROVIDER --repo "$GITHUB_REPOSITORY" --body coderabbit
          actual="$(gh variable get CONTINUUM_REVIEW_PROVIDER --repo "$GITHUB_REPOSITORY")"
          test "$actual" = "coderabbit"
          echo "CONTINUUM_REVIEW_PROVIDER=coderabbit verified"
