name: Merge trusted release automation PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-release-automation-merge.yml@73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7
    secrets: inherit
    with:
      continuum_ref: '73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7'
