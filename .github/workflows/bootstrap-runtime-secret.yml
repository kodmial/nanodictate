name: Probe Render secret placement

on:
  push:
    paths:
      - '.github/workflows/bootstrap-runtime-secret.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check secret placement and Render account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          echo "NANODICTATE_ACTIONS_SECRETS_BEGIN"
          gh api repos/kodmial/nanodictate/actions/secrets --jq '.secrets[].name' || true
          echo "NANODICTATE_ACTIONS_SECRETS_END"

          echo "RUNTIME_LAB_ACTIONS_SECRETS_BEGIN"
          gh api repos/kodmial/runtime-lab/actions/secrets --jq '.secrets[].name' || true
          echo "RUNTIME_LAB_ACTIONS_SECRETS_END"

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "NANODICTATE_RENDER_API_KEY_PRESENT=no"
            exit 0
          fi

          echo "NANODICTATE_RENDER_API_KEY_PRESENT=yes"
          code=$(curl -sS -o /tmp/owners.json -w '%{http_code}' \
            'https://api.render.com/v1/owners?limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "RENDER_OWNERS_HTTP_STATUS=$code"
          if [ "$code" = "200" ]; then
            echo "RENDER_WORKSPACES_BEGIN"
            jq -c '.[] | (.owner // .) | {id:(.id // .ownerId // .owner_id),name:(.name // null),email:(.email // null),type:(.type // null)}' /tmp/owners.json
            echo "RENDER_WORKSPACES_END"
          else
            jq -c . /tmp/owners.json || true
          fi
