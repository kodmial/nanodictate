name: Probe runtime-lab secret locations

on:
  push:
    paths:
      - '.github/workflows/bootstrap-runtime-secret.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: List runtime-lab secret names by location
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          echo "ACTIONS_SECRETS_BEGIN"
          gh api repos/kodmial/runtime-lab/actions/secrets --jq '.secrets[].name' || true
          echo "ACTIONS_SECRETS_END"

          echo "DEPENDABOT_SECRETS_BEGIN"
          gh api repos/kodmial/runtime-lab/dependabot/secrets --jq '.secrets[].name' || true
          echo "DEPENDABOT_SECRETS_END"

          echo "CODESPACES_REPO_SECRETS_BEGIN"
          gh api repos/kodmial/runtime-lab/codespaces/secrets --jq '.secrets[].name' || true
          echo "CODESPACES_REPO_SECRETS_END"
