name: Probe runtime-lab environment secrets

on:
  push:
    paths:
      - '.github/workflows/bootstrap-runtime-secret.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: List runtime-lab environments and secret names
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          echo "ENVIRONMENTS_BEGIN"
          gh api repos/kodmial/runtime-lab/environments --jq '.environments[].name' || true
          echo "ENVIRONMENTS_END"

          for env_name in $(gh api repos/kodmial/runtime-lab/environments --jq '.environments[].name' 2>/dev/null || true); do
            echo "ENV_SECRET_NAMES_BEGIN:$env_name"
            gh api "repos/kodmial/runtime-lab/environments/$env_name/secrets" --jq '.secrets[].name' || true
            echo "ENV_SECRET_NAMES_END:$env_name"
          done
