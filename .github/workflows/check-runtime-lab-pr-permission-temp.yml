name: Configure runtime-lab Actions PR permission

on:
  push:
    paths:
      - '.github/workflows/check-runtime-lab-pr-permission-temp.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Enable repository Actions PR permission
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT repos/kodmial/runtime-lab/actions/permissions/workflow \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f default_workflow_permissions=read \
            -F can_approve_pull_request_reviews=true >/dev/null

          gh api repos/kodmial/runtime-lab/actions/permissions/workflow \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq '{default_workflow_permissions,can_approve_pull_request_reviews}'
