# A fresh PR head invalidates both CI readiness and the "review already
# requested" lock. add-review-label.yml restores review-ready only after CI
# succeeds for that exact head, then requests exactly one incremental CodeRabbit
# review for it.
name: remove-review-ready-on-sync

on:
  pull_request:
    types: [synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo, number } = context.issue;

            for (const name of ['review-ready', 'coderabbit-review-requested']) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }
