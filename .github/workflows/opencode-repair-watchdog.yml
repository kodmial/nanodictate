name: OpenCode repair watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: opencode-repair-watchdog
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Reconcile stalled OpenCode PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const watched = new Set(['CI', 'Packaging smoke']);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            for (const listed of pulls) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: listed.number,
              });
              if (pr.draft || pr.head.repo?.full_name !== repoFullName ||
                  !pr.head.ref.startsWith('opencode/')) continue;

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, branch: pr.head.ref, event: 'pull_request', per_page: 100 }
              );
              const latest = new Map();
              for (const run of runs) {
                if (!watched.has(run.name) || run.head_sha !== pr.head.sha) continue;
                const old = latest.get(run.name);
                if (!old || new Date(run.created_at) > new Date(old.created_at)) {
                  latest.set(run.name, run);
                }
              }

              for (const run of latest.values()) {
                if (run.status !== 'completed' ||
                    !['failure', 'timed_out', 'cancelled'].includes(run.conclusion)) continue;

                // Re-running the failed workflow is deliberate: its completion
                // emits workflow_run again, which wakes the normal repair
                // controller. This makes a lost/missed repair event self-heal
                // without duplicating the OpenCode dispatch logic here.
                core.warning(`Recovering PR #${pr.number}: ${run.name} ${run.id} is ${run.conclusion}`);
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({
                    owner, repo, run_id: run.id,
                  });
                } catch (err) {
                  // 409/422 means GitHub currently cannot rerun it (for example,
                  // a rerun is already queued). The next watchdog pass retries.
                  if (![409, 422].includes(err.status)) throw err;
                  core.info(`PR #${pr.number}: rerun already pending/unavailable (${err.status}).`);
                }
              }
            }
