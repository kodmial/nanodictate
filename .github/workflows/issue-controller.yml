name: Issue controller

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-controller
  cancel-in-progress: false

jobs:
  dispatch-next-issue:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Select next eligible issue and dispatch OpenCode
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep exactly one implementation issue in flight at a time. An issue is
          # considered in flight when an open PR contains "Closes #N" in its body.
          OPEN_PRS="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100")"
          if jq -e '[.[] | select((.body // "") | test("(?i)\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#\\d+"))] | length > 0' <<<"$OPEN_PRS" >/dev/null; then
            echo "An implementation PR is already open; not dispatching another issue."
            exit 0
          fi

          ISSUES="$(gh api --paginate "repos/${REPOSITORY}/issues?state=open&per_page=100")"

          # Pull requests are also returned by the Issues API; exclude them. Only
          # explicitly prioritized issues participate. No default priority is added.
          mapfile -t CANDIDATES < <(
            jq -r '
              [ .[]
                | select(.pull_request == null)
                | . as $issue
                | [(.labels[]?.name // empty) | select(test("^priority:[pP][0-3]$"))] as $priorities
                | select(($priorities | length) == 1)
                | {
                    number: .number,
                    priority: ($priorities[0] | ascii_downcase)
                  }
              ]
              | sort_by(
                  (if .priority == "priority:p0" then 0
                   elif .priority == "priority:p1" then 1
                   elif .priority == "priority:p2" then 2
                   else 3 end),
                  .number
                )
              | .[].number
            ' <<<"$ISSUES"
          )

          if [[ ${#CANDIDATES[@]} -eq 0 ]]; then
            echo "No open issue has exactly one priority:p0..priority:p3 label."
            exit 0
          fi

          SELECTED=""
          for ISSUE_NUMBER in "${CANDIDATES[@]}"; do
            # Native issue dependencies are the source of truth. A 404 here is
            # treated as a workflow error rather than silently dispatching a task.
            BLOCKERS="$(gh api --paginate \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/dependencies/blocked_by")"

            OPEN_BLOCKERS="$(jq '[.[] | select(.state != "closed")] | length' <<<"$BLOCKERS")"
            if [[ "$OPEN_BLOCKERS" -ne 0 ]]; then
              echo "Issue #${ISSUE_NUMBER} is blocked by ${OPEN_BLOCKERS} open issue(s); skipping."
              continue
            fi

            # Avoid duplicate dispatch if /oc was already posted and OpenCode has
            # not created its PR yet. The controller marker makes retries idempotent.
            COMMENTS="$(gh api --paginate "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100")"
            if jq -e '.[] | select((.body // "") | contains("<!-- issue-controller-dispatch -->"))' <<<"$COMMENTS" >/dev/null; then
              echo "Issue #${ISSUE_NUMBER} was already dispatched by the controller; skipping."
              continue
            fi

            SELECTED="$ISSUE_NUMBER"
            break
          done

          if [[ -z "$SELECTED" ]]; then
            echo "No eligible unblocked issue found."
            exit 0
          fi

          COMMENT=$(cat <<'EOF'
          /oc

          <!-- issue-controller-dispatch -->
          EOF
          )

          # TAP_PAT is intentional: opencode.yml accepts /oc only when the comment
          # actor is the repository owner. github.token would act as github-actions[bot].
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${SELECTED}/comments" \
            -f "body=${COMMENT}" >/dev/null

          echo "Dispatched issue #${SELECTED}."
