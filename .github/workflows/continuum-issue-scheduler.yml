name: Issue scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ["OpenCode agent"]
    types: [completed]

permissions:
  contents: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/issue-scheduler.yml@6c285dcd47f13919bb1af3be694bcc92c9f42356
    secrets: inherit
    with:
      continuum_ref: '6c285dcd47f13919bb1af3be694bcc92c9f42356'
      count_open_prs_as_wip: 'false'
      pause_on_failure: 'false'
