name: Issue scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ["OpenCode agent"]
    types: [completed]

permissions:
  contents: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/issue-scheduler.yml@73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7
    secrets: inherit
    with:
      continuum_ref: '73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7'
      count_open_prs_as_wip: 'false'
      pause_on_failure: 'false'
