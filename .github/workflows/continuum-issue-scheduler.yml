name: Issue scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/issue-scheduler.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      lease_minutes: '210'
      count_open_prs_as_wip: 'false'
      pause_on_failure: 'false'
