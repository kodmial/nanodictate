name: Release PR

on:
  pull_request:
    types: [closed]
  # Recovery/reconciliation wake-up: a normal code PR can merge while the
  # previous Release workflow is still publishing. In that window
  # Version.swift is already ahead of the latest published release, so the
  # pull_request event correctly defers. Re-run reconciliation when Release
  # finishes successfully so that deferred code cannot be stranded forever.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-release-pr.yml@73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7
    secrets: inherit
    with:
      continuum_ref: '73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7'
