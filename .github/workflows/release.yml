name: Release

on:
  push:
    tags:
      - 'v*'

# Creating the GitHub Release needs contents: write; the build job only reads
# the repo. Permissions are set per job (least privilege).
permissions: {}

jobs:
  # Build the two macOS binaries (Intel + Apple Silicon), ad-hoc sign them and
  # pack the release tarball. The archive name contract is fixed:
  #   nanodictate-<VERSION>-macos-<arch>.tar.gz   (VERSION without the "v" prefix)
  build:
    name: Build & Package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 is retired from Actions; macos-15-intel is the Intel
          # runner that still produces a native x86_64 binary.
          - os: macos-15-intel
            arch: x86_64
            swift: "6.1"
          - os: macos-14
            arch: arm64
            swift: "6.1"

    steps:
      - name: Checkout
        # actions/checkout@v4 = 11d5960a326750d5838078e36cf38b85af677262
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          # Same toolchain as the CI workflow (swift-tools-version:5.7 manifest,
          # Swift 5 language mode), pinned by full commit SHA (tag v2). Set
          # explicitly per matrix entry: macOS 15 runner images ship a newer
          # Xcode/Swift by default.
          swift-version: "${{ matrix.swift }}"

      - name: Build release binaries
        run: |
          swift build -c release --product NanoDictateAgent
          swift build -c release --product nanodictate

      - name: Ad-hoc sign binaries
        # Release binaries are ad-hoc signed WITHOUT entitlements on purpose:
        # Microphone/Accessibility TCC grants are per-machine, so each user is
        # asked on their own Mac (system dialog or their own re-sign) — an
        # entitlements blob in the release would apply to nothing. The
        # .entitlements files still ship in the archive for users who re-sign.
        run: |
          codesign --force -s - --identifier com.nanodictate.agent .build/release/NanoDictateAgent
          codesign --force -s - --identifier com.nanodictate.ctl .build/release/nanodictate
          codesign --verify --strict .build/release/NanoDictateAgent
          codesign --verify --strict .build/release/nanodictate

      - name: Package tarball
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          DIST="dist"
          mkdir -p "$DIST"
          # Resources/ ships for reference only: entitlements are already
          # applied to the binaries at codesign time, and the LaunchAgent plist
          # is generated inline by the CLI (`nanodictate start` writes the
          # canonical ~/Library/LaunchAgents/com.nanodictate.agent.plist);
          # regenerated at install time by the Homebrew formula's post_install
          # only — the MacPorts port's destroot stages binaries + config
          # without touching the user home (it prints `nanodictate start`
          # instead). The runtime needs none of these — formulae/ports ship
          # binaries + config only.
          cp .build/release/NanoDictateAgent .build/release/nanodictate config.example.toml "$DIST"/
          cp -R Resources "$DIST"/
          ARCHIVE="$DIST/nanodictate-$RELEASE_VERSION-macos-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIST" NanoDictateAgent nanodictate config.example.toml Resources
          ls -l "$ARCHIVE"

      - name: Upload tarball
        # actions/upload-artifact@v4 = ea165f8d65b6e75b540449e92b4886f43607fa02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nanodictate-release-${{ matrix.arch }}
          path: dist/nanodictate-*.tar.gz
          if-no-files-found: error

  # Aggregation: collect both tarballs, print names/checksums, create the
  # GitHub Release and attach the assets.
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarballs
        # actions/download-artifact@v4 = d3f86a106a0bac45b974a628896c90dbdf5c8093
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nanodictate-release-*
          path: dist
          merge-multiple: true

      - name: Compute asset info
        id: assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
          ls -1 dist/nanodictate-*.tar.gz

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: sha256sum nanodictate-*.tar.gz | tee SHA256SUMS.txt

      - name: Create release & upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        # A re-run whose release already exists (fully or partially published)
        # re-attaches every asset with --clobber, fixing partial uploads; the
        # job exits 0 only after that upload itself succeeded (set -e). Any
        # other failure exits non-zero.
        run: |
          set -euo pipefail
          NOTES="Release v$RELEASE_VERSION.

          See [CHANGELOG.md](https://github.com/$REPO/blob/$REF/CHANGELOG.md) for the full release notes."
          if gh release create "$REF" \
            dist/nanodictate-*.tar.gz \
            dist/SHA256SUMS.txt \
            --title "v$RELEASE_VERSION" \
            --notes "$NOTES"; then
            : # release created
          else
            rc=$?
            if gh release view "$REF" >/dev/null 2>&1; then
              echo "Release $REF already exists (re-run); re-attaching assets (--clobber)."
              gh release upload "$REF" dist/nanodictate-*.tar.gz dist/SHA256SUMS.txt --clobber
              exit 0
            fi
            exit "$rc"
          fi