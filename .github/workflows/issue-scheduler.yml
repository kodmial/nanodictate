name: Continuum scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: continuum-nanodictate-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    uses: kodmial/continuum/.github/workflows/consumer-scheduler.yml@2ee9c8703676f6ae009f9a58912893633902b026
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    with:
      opencode_workflow: opencode.yml
      wip_limit: ${{ fromJSON(vars.AUTOMATION_WIP_LIMIT || '2') }}
      lease_minutes: ${{ fromJSON(vars.AUTOMATION_LEASE_MINUTES || '45') }}
      max_attempts: ${{ fromJSON(vars.AUTOMATION_MAX_DISPATCH_ATTEMPTS || '3') }}
