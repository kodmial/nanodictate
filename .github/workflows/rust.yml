name: Rust engine

# Shared-engine quality gates: formatting, lints, tests on macOS/Windows/Linux,
# the Windows DLL portability artifact, the generated C ABI freshness check,
# and the Swift<->Rust integration test against the real built library.
#
# The Windows job is a portability check for the shared engine only; it is
# not the Windows application (see docs/architecture-rust-engine.md).

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'Sources/NanoDictateRustFFI/**'
      - 'Sources/NanoDictateRustBridge/**'
      - 'Sources/NanoDictateCore/RustEngine.swift'
      - 'Sources/NanoDictateCore/RustParityGate.swift'
      - 'Sources/NanoDictateCore/RustRealtimeAudio.swift'
      - 'Tests/NanoDictateCoreTests/RustParityTests.swift'
      - 'Tests/NanoDictateCoreTests/RustParityGateTests.swift'
      - 'Tests/NanoDictateCoreTests/RustDeterministicCutoverTests.swift'
      - 'Tests/NanoDictateCoreTests/RustRealtimeAudioCutoverTests.swift'
      - 'Tests/NanoDictateCoreTests/RustSessionActivationTests.swift'
      - 'scripts/build-rust-core.sh'
      - 'scripts/check-rust-abi.sh'
      - 'docs/architecture-rust-engine.md'
      - 'Package.swift'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'Sources/NanoDictateRustFFI/**'
      - 'Sources/NanoDictateRustBridge/**'
      - 'Sources/NanoDictateCore/RustEngine.swift'
      - 'Sources/NanoDictateCore/RustParityGate.swift'
      - 'Sources/NanoDictateCore/RustRealtimeAudio.swift'
      - 'Tests/NanoDictateCoreTests/RustParityTests.swift'
      - 'Tests/NanoDictateCoreTests/RustParityGateTests.swift'
      - 'Tests/NanoDictateCoreTests/RustDeterministicCutoverTests.swift'
      - 'Tests/NanoDictateCoreTests/RustRealtimeAudioCutoverTests.swift'
      - 'Tests/NanoDictateCoreTests/RustSessionActivationTests.swift'
      - 'scripts/build-rust-core.sh'
      - 'scripts/check-rust-abi.sh'
      - 'docs/architecture-rust-engine.md'
      - 'Package.swift'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

# Keep only the newest run per PR/branch.
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: fmt/clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The actual runner OS version is evidence for #123: a macOS 15
      # test run is not a macOS 12 runtime test (tracked in #35).
      - name: Report runner OS version (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uname -a
          sw_vers 2>/dev/null || true
          echo "NOTE: a macOS 15 CI run is not a macOS 12 runtime test (see #35)."

      - name: Report runner OS version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          systeminfo | Select-String 'OS Name','OS Version'
          uname -a

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test

      - name: Release build (staticlib + cdylib)
        working-directory: rust
        run: cargo build --release -p nanodictate-core

      # Windows portability artifact: the shared engine as a DLL.
      - name: Upload Windows DLL artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nanodictate-core-windows-dll
          path: rust/target/release/nanodictate_core.dll
          if-no-files-found: error

  abi-header:
    name: C ABI header freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Report runner OS version
        run: uname -a

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - name: Verify generated header is fresh
        run: bash scripts/check-rust-abi.sh

  swift-integration:
    name: Swift<->Rust integration (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The actual runner OS version is evidence for #123: this macOS 15
      # run validates the 12.0 deployment-target build, not macOS 12
      # runtime behavior (tracked in #35).
      - name: Report runner OS version
        run: |
          sw_vers
          uname -a
          echo "NOTE: this macOS 15 CI run is not a macOS 12 runtime test (see #35)."

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.1"

      - name: Build Rust engine
        working-directory: rust
        run: cargo build --release -p nanodictate-core

      - name: Build (Swift + Rust)
        run: >
          swift build
          -Xlinker ${{ github.workspace }}/rust/target/release/libnanodictate_core.a

      # The custom test runner (Tests/NanoDictateCoreTests/main.swift) exits
      # non-zero on the first failure; RustParityTests runs the shared input
      # vectors against the Swift reference and the engine here. Build
      # options (-Xlinker) must precede the executable name: anything after
      # it is passed to the test binary instead of the linker, which drops
      # the Rust archive and fails with undefined _nd_* symbols. The archive
      # is linked by absolute path so the macOS build never picks the cdylib
      # (which would embed an absolute LC_LOAD_DYLIB path and break packaged
      # binaries on other hosts).
      - name: Run tests (Swift + Rust)
        run: >
          swift run
          -Xlinker ${{ github.workspace }}/rust/target/release/libnanodictate_core.a
          NanoDictateCoreTests
