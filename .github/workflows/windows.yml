name: Windows host

# Complete-product CI for the supported Windows NanoDictate release.
# Builds the Rust cdylib/DLL with the MSVC target, the portable C# product
# (Core + Host + Smoke + tests), the Windows-only WinUI 3 entrypoint, the
# real per-user Inno Setup installer, and stages the MSIX layout plus
# portable ZIP as validation-only artifacts (see windows/DISTRIBUTION.md:
# msix-stage/ is NOT an installer).
#
# Pull-request runs build an UNSIGNED installer and exercise the full
# install -> versioned upgrade -> uninstall cycle in isolation. Stable
# release signing uses configured credentials only (WINDOWS_SIGN_PFX_B64 +
# WINDOWS_SIGN_PASSWORD); this workflow never mints a pretend
# trusted/self-signed production certificate.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'rust/**'
      - 'windows/**'
      - 'scripts/build-windows-host.sh'
      - 'scripts/make_winget_manifests.py'
      - 'scripts/test-windows-distribution.sh'
      - 'config.example.toml'
      - 'Sources/NanoDictateCore/Version.swift'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'
      - '.github/workflows/winget-submit.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'windows/**'
      - 'scripts/build-windows-host.sh'
      - 'scripts/make_winget_manifests.py'
      - 'scripts/test-windows-distribution.sh'
      - 'config.example.toml'
      - 'Sources/NanoDictateCore/Version.swift'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'
      - '.github/workflows/winget-submit.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Rust DLL + C# product (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Ensure MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python (WinGet manifest tooling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust tests (shared core)
        run: cargo test -p nanodictate-core
        working-directory: rust

      - name: Build Rust DLL (MSVC cdylib)
        run: cargo build --release -p nanodictate-core
        working-directory: rust

      - name: Verify DLL artifact exists
        shell: pwsh
        run: |
          $dll = "rust/target/release/nanodictate_core.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          Get-Item $dll | Format-Table Name, Length

      - name: Build portable C# product
        run: dotnet build windows/NanoDictate.sln -c Release

      - name: Build WinUI 3 entrypoint (Windows-only)
        # Windows App SDK 1.5 PRI/MRT tasks are supplied by Visual Studio MSBuild,
        # not the dotnet SDK's bundled MSBuild.
        shell: pwsh
        run: pwsh windows/package/build-winui.ps1 -Configuration Release

      - name: Stage DLL next to managed binaries
        shell: pwsh
        run: |
          $dll = "rust/target/release/nanodictate_core.dll"
          $targets = @(
            "windows/src/NanoDictate.Core/bin/Release/net8.0",
            "windows/src/NanoDictate.Host/bin/Release/net8.0",
            "windows/src/NanoDictate.Smoke/bin/Release/net8.0",
            "windows/tests/NanoDictate.Core.Tests/bin/Release/net8.0"
          )
          foreach ($dir in $targets) {
            if (Test-Path $dir) { Copy-Item $dll $dir -Force }
          }
          New-Item -ItemType Directory -Force -Path windows/artifacts | Out-Null
          Copy-Item $dll windows/artifacts/ -Force

      - name: Run C# product tests
        run: dotnet test windows/NanoDictate.sln -c Release --no-build

      - name: Run smoke executable
        run: dotnet run --project windows/src/NanoDictate.Smoke -c Release --no-build -- config.example.toml

      - name: Run product diagnostics
        run: dotnet run --project windows/src/NanoDictate.Host -c Release --no-build -- doctor --config config.example.toml

      - name: List providers and routing
        run: dotnet run --project windows/src/NanoDictate.Host -c Release --no-build -- providers --config config.example.toml

      - name: Read installed product version
        run: dotnet run --project windows/src/NanoDictate.Host -c Release --no-build -- version

      - name: Validate Windows distribution policy (Linux-runnable)
        shell: bash
        run: bash scripts/test-windows-distribution.sh

      - name: Stage MSIX layout and portable ZIP (validation only, NOT an installer)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" } else { $version = $version -replace '^v', '' -replace '-.*$', '' }
          pwsh windows/package/make-msix.ps1 -Version $version -OutDir windows/artifacts

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still missing after choco install" }
          & $iscc /? | Select-Object -First 3

      - name: Build distributable ZIP and EXE installer
        shell: pwsh
        run: pwsh windows/package/make-release.ps1 -Version 0.0.0 -OutDir windows/artifacts

      - name: Verify portable files and silent install/upgrade/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "windows/artifacts/nanodictate-0.0.0-windows-x64.zip"
          $setup = "windows/artifacts/nanodictate-0.0.0-windows-x64-setup.exe"
          if (-not (Test-Path $zip) -or -not (Test-Path $setup)) { throw "Missing Windows deliverables" }
          $unpack = Join-Path $env:RUNNER_TEMP "nanodictate-zip-smoke"
          Expand-Archive $zip $unpack -Force
          foreach ($name in @("NanoDictate.App.exe", "nanodictate_core.dll", "coreclr.dll", "hostfxr.dll", "config.example.toml")) {
            if (-not (Test-Path (Join-Path $unpack $name))) { throw "Portable ZIP lacks $name" }
          }
          $installed = Join-Path $env:RUNNER_TEMP "nanodictate-install"
          $userConfig = Join-Path $env:APPDATA "NanoDictate/ci-preservation-marker.txt"
          New-Item -Force -ItemType Directory (Split-Path $userConfig) | Out-Null
          Set-Content -Path $userConfig -Value "preserve" -NoNewline
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installed"
          if ($LASTEXITCODE -ne 0) { throw "Silent install failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $installed "NanoDictate.App.exe"))) { throw "Installer did not deploy app" }
          # Same-version reinstall must not fail or overwrite user data.
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installed"
          if ($LASTEXITCODE -ne 0) { throw "Silent reinstall failed: $LASTEXITCODE" }
          $uninstall = Join-Path $installed "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          & $uninstall /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed: $LASTEXITCODE" }
          if (Test-Path (Join-Path $installed "NanoDictate.App.exe")) { throw "Uninstall left deployed executable" }
          if ((Get-Content $userConfig -Raw) -ne "preserve") { throw "Uninstall deleted user data" }

      - name: Build per-user installer (unsigned PR smoke; signed on tags when credentials exist)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          $version = $env:REF_NAME
          if ($version -match '^v?\d+\.\d+\.\d+') {
            $version = $version -replace '^v', '' -replace '-.*$', ''
          } else {
            $version = (Select-String -Path Sources/NanoDictateCore/Version.swift -Pattern '\d+\.\d+\.\d+' | Select-Object -First 1).Matches.Value
          }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            # Tag builds are release candidates: fail closed without signing credentials.
            pwsh windows/package/build-installer.ps1 -Version $version -OutDir windows/artifacts -RequireSigned
          } else {
            pwsh windows/package/build-installer.ps1 -Version $version -OutDir windows/artifacts
          }
          $exe = Get-ChildItem windows/artifacts/installer-out/NanoDictate-Setup-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer EXE missing after build-installer.ps1" }
          if (-not (Test-Path "$($exe.FullName).sha256")) { throw "Installer SHA-256 sidecar missing" }
          Get-Item $exe.FullName | Format-Table Name, Length
          Get-Content "$($exe.FullName).sha256"

      - name: Install, upgrade, and uninstall smoke (clean Windows)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME
          if ($version -match '^v?\d+\.\d+\.\d+') {
            $version = $version -replace '^v', '' -replace '-.*$', ''
          } else {
            $version = (Select-String -Path Sources/NanoDictateCore/Version.swift -Pattern '\d+\.\d+\.\d+' | Select-Object -First 1).Matches.Value
          }
          $exe = (Get-ChildItem windows/artifacts/installer-out/NanoDictate-Setup-*-x64.exe | Select-Object -First 1).FullName
          pwsh windows/package/test-installer.ps1 -Installer $exe -Version $version -LogDir windows/artifacts/install-test-logs

      - name: Generate WinGet manifests (validation only; submission is separate)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME
          if ($version -match '^v?\d+\.\d+\.\d+') {
            $version = $version -replace '^v', '' -replace '-.*$', ''
          } else {
            $version = (Select-String -Path Sources/NanoDictateCore/Version.swift -Pattern '\d+\.\d+\.\d+' | Select-Object -First 1).Matches.Value
          }
          $exe = (Get-ChildItem windows/artifacts/installer-out/NanoDictate-Setup-*-x64.exe | Select-Object -First 1).FullName
          $sha = ((Get-Content "$exe.sha256" -Raw).Split()[0]).Trim().ToLowerInvariant()
          $url = "https://github.com/kodmial/nanodictate/releases/download/v$version/$(Split-Path $exe -Leaf)"
          python scripts/make_winget_manifests.py --version $version --url $url --sha256 $sha --out windows/artifacts/winget-manifests
          Get-ChildItem windows/artifacts/winget-manifests -Recurse | Format-Table FullName

      - name: Upload installer test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanodictate-windows-install-test-logs
          path: windows/artifacts/install-test-logs/
          if-no-files-found: warn

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanodictate-windows-x64
          path: windows/artifacts/
          if-no-files-found: error
