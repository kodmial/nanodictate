name: Windows host

# Complete-product CI for the supported Windows NanoDictate release.
# Builds the Rust cdylib/DLL with the MSVC target, the portable C# product
# (Core + Host + Smoke + tests), the Windows-only WinUI 3 entrypoint, and
# builds the shipped self-contained ZIP plus per-user Inno Setup EXE.

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'Tests/Fixtures/HUD/**'
      - 'windows/**'
      - 'scripts/build-windows-host.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/scoop-manifest.jq'
      - 'scripts/test-windows-distribution.ps1'
      - 'scripts/test-windows-install-chain.ps1'
      - 'scripts/test-windows-installer-runner.ps1'
      - 'scripts/windows-installer-runner.psm1'
      - 'scripts/fixtures/**'
      - 'bucket/**'
      - 'config.example.toml'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'Tests/Fixtures/HUD/**'
      - 'windows/**'
      - 'scripts/build-windows-host.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/scoop-manifest.jq'
      - 'scripts/test-windows-distribution.ps1'
      - 'scripts/test-windows-install-chain.ps1'
      - 'scripts/test-windows-installer-runner.ps1'
      - 'scripts/windows-installer-runner.psm1'
      - 'scripts/fixtures/**'
      - 'bucket/**'
      - 'config.example.toml'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Rust DLL + C# product (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify Windows first-use distribution contracts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-distribution.ps1

      - name: Verify Windows installer release selection chain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-install-chain.ps1

      - name: Verify bounded installer process-tree runner
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-installer-runner.ps1

      - name: Ensure MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rust tests (shared core)
        run: cargo test -p nanodictate-core
        working-directory: rust

      - name: Build Rust DLL (MSVC cdylib)
        run: cargo build --release -p nanodictate-core
        working-directory: rust

      - name: Verify DLL artifact exists
        shell: pwsh
        run: |
          $dll = "rust/target/release/nanodictate_core.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          Get-Item $dll | Format-Table Name, Length

      - name: Build portable C# product
        run: dotnet build windows/NanoDictate.sln -c Release

      - name: Build WinUI 3 entrypoint (Windows-only)
        # Windows App SDK 1.5 PRI/MRT tasks are supplied by Visual Studio MSBuild,
        # not the dotnet SDK's bundled MSBuild.
        shell: pwsh
        run: pwsh windows/package/build-winui.ps1 -Configuration Release

      - name: Stage DLL next to managed binaries
        shell: pwsh
        run: |
          $dll = "rust/target/release/nanodictate_core.dll"
          $targets = @(
            "windows/src/NanoDictate.Core/bin/Release/net8.0",
            "windows/src/NanoDictate.Host/bin/Release/net8.0",
            "windows/src/NanoDictate.Smoke/bin/Release/net8.0",
            "windows/tests/NanoDictate.Core.Tests/bin/Release/net8.0"
          )
          foreach ($dir in $targets) {
            if (Test-Path $dir) { Copy-Item $dll $dir -Force }
          }
          New-Item -ItemType Directory -Force -Path windows/artifacts | Out-Null
          Copy-Item $dll windows/artifacts/ -Force

      - name: Run C# product tests
        run: dotnet test windows/NanoDictate.sln -c Release --no-build

      - name: Run smoke executable
        run: dotnet run --project windows/src/NanoDictate.Smoke -c Release --no-build -- config.example.toml

      - name: Run product diagnostics
        run: dotnet run --project windows/src/NanoDictate.Host -c Release --no-build -- doctor --config config.example.toml

      - name: List providers and routing
        run: dotnet run --project windows/src/NanoDictate.Host -c Release --no-build -- providers --config config.example.toml

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build distributable ZIP and EXE installer
        shell: pwsh
        run: pwsh windows/package/make-release.ps1 -Version 0.0.0 -OutDir windows/artifacts

      - name: Verify portable files and silent install/upgrade/uninstall
        shell: pwsh
        run: pwsh -NoProfile -File windows/package/test-ci-installer-lifecycle.ps1 -Version 0.0.0

      - name: Assert exact candidate ZIP/EXE identity and installation lifecycle
        shell: pwsh
        run: pwsh -NoProfile -File windows/package/test-release-candidate.ps1 -Version 0.0.0

      - name: Verify Scoop bucket lifecycle hooks without user interaction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "bucket/nanodictate.json" -Raw | ConvertFrom-Json
          if (!$manifest.post_install -or !$manifest.pre_uninstall) { throw "Missing first-party Scoop lifecycle hooks" }
          $scoopdir = Join-Path $env:RUNNER_TEMP "scoop-nanodictate-test"
          $dir = Join-Path $scoopdir "apps/nanodictate/current"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "windows/artifacts/published-win-x64/NanoDictate.App.exe" (Join-Path $dir "NanoDictate.App.exe")
          $cmd = "install"
          $global = $false
          # Do not launch a real WinUI window in a noninteractive hosted runner.
          function Start-Process { param($FilePath, $ArgumentList) if (!(Test-Path $FilePath)) { throw "Missing launched app: $FilePath" } }
          foreach ($line in $manifest.pre_install) { Invoke-Expression $line }
          foreach ($line in $manifest.post_install) { Invoke-Expression $line }
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $wanted = '"' + (Join-Path $dir "NanoDictate.App.exe") + '" --background'
          if ((Get-ItemProperty -Path $runKey -Name NanoDictate).NanoDictate -ne $wanted) { throw "Scoop autostart not stable" }
          $cmd = "update"
          foreach ($line in $manifest.pre_install) { Invoke-Expression $line }
          foreach ($line in $manifest.post_install) { Invoke-Expression $line }
          if ((Get-ItemProperty -Path $runKey -Name NanoDictate).NanoDictate -ne $wanted) { throw "Scoop update changed startup path" }
          $cmd = "uninstall"
          foreach ($line in $manifest.pre_uninstall) { Invoke-Expression $line }
          if ((Get-ItemProperty -Path $runKey -Name NanoDictate -ErrorAction SilentlyContinue).NanoDictate) { throw "Scoop uninstall did not remove startup entry" }

      - name: Upload Windows distribution smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanodictate-windows-x64
          path: |
            windows/artifacts/nanodictate-0.0.0-windows-x64.zip
            windows/artifacts/nanodictate-0.0.0-windows-x64-setup.exe
            windows/artifacts/windows-candidate-measurements.json
            windows/artifacts/windows-ci-lifecycle-measurements.json
          if-no-files-found: error

      - name: Upload Windows installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics-${{ github.run_id }}
          path: |
            windows/artifacts/installer-logs/**
            windows/artifacts/windows-candidate-measurements.json
            windows/artifacts/windows-ci-lifecycle-measurements.json
          if-no-files-found: warn
