name: Bootstrap private quantum repository

on:
  push:
    paths:
      - '.github/workflows/bootstrap-create-quantum.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create private kodmial/quantum repository
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh api repos/kodmial/quantum >/dev/null 2>&1; then
            visibility="$(gh api repos/kodmial/quantum --jq .visibility)"
            test "$visibility" = "private"
            echo "Repository already exists and is private"
          else
            gh api --method POST user/repos               -f name=quantum               -F private=true               --jq '{full_name,private,visibility,html_url}'
          fi
