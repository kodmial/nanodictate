name: Set Zen Muse model variable

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  set-model:
    if: >-
      github.event.issue.number == 12 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/set-zen-muse-1.3'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Zen and set OPENCODE_MODEL
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail

          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
            -H "Accept: application/json" \
            https://opencode.ai/zen/v1/models)"

          echo "Muse/Spark models returned by Zen:"
          printf '%s' "$RESPONSE" | jq -r '
            .. | objects |
            select(
              ((.id // "") | ascii_downcase | contains("muse")) or
              ((.name // "") | ascii_downcase | contains("muse")) or
              ((.id // "") | ascii_downcase | contains("spark")) or
              ((.name // "") | ascii_downcase | contains("spark"))
            ) |
            "id=\(.id // "") name=\(.name // "")"
          ' | sort -u

          MODEL_ID="$(printf '%s' "$RESPONSE" | jq -r '
            [
              .. | objects |
              select(
                (.id // "") == "muse-spark-1.3" or
                (.name // "") == "Muse Spark 1.3"
              ) |
              .id // empty
            ][0] // empty
          ')"

          if [[ -z "$MODEL_ID" ]]; then
            echo "::error::Zen did not return the exact Muse Spark 1.3 model."
            exit 1
          fi

          VALUE="opencode/${MODEL_ID}"

          if gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/actions/variables/OPENCODE_MODEL" \
            -f name=OPENCODE_MODEL \
            -f value="$VALUE" \
            >/dev/null 2>&1
          then
            echo "Updated repository variable OPENCODE_MODEL=$VALUE"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name=OPENCODE_MODEL \
              -f value="$VALUE" \
              >/dev/null
            echo "Created repository variable OPENCODE_MODEL=$VALUE"
          fi
