name: Packaging smoke

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - '.github/workflows/continuum-tech-swift-packaging-smoke.yml'
      - '.github/workflows/continuum-tech-swift-release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - '.github/workflows/continuum-tech-swift-packaging-smoke.yml'
      - '.github/workflows/continuum-tech-swift-release.yml'
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  schedule:
    # Non-round daily canary time (03:17 UTC), not the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which smoke mode to run'
        required: false
        type: choice
        default: both
        options:
          - both
          - candidate
          - production
      version:
        description: 'Production version to verify (e.g. 0.1.7). Empty = latest stable release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

# Collapse repeated runs for the same PR/ref before they can consume scarce
# macOS runner slots. The reusable workflow has the same policy internally.
concurrency:
  group: nanodictate-packaging-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call:
    # Continuum main uses the runner-bundled Swift 6.1.x toolchain and gives
    # the exact-head main candidate priority over speculative PR packaging.
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-packaging-smoke.yml@main
    secrets: inherit
    with:
      continuum_ref: "main"
      native_prepare_command: "${{ vars.CONTINUUM_NATIVE_PREPARE_COMMAND || '' }}"
      static_archive_path: "${{ vars.CONTINUUM_STATIC_ARCHIVE_PATH || '' }}"
      mode: "${{ inputs.mode || 'both' }}"
      version: "${{ inputs.version || '' }}"
