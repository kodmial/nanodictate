name: Packaging smoke

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - 'rust/**'
      - '.github/workflows/continuum-tech-swift-packaging-smoke.yml'
      - '.github/workflows/continuum-tech-swift-release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - 'rust/**'
      - '.github/workflows/continuum-tech-swift-packaging-smoke.yml'
      - '.github/workflows/continuum-tech-swift-release.yml'
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  schedule:
    # Non-round daily canary time (03:17 UTC), not the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which smoke mode to run'
        required: false
        type: choice
        default: both
        options:
          - both
          - candidate
          - production
      version:
        description: 'Production version to verify (e.g. 0.1.7). Empty = latest stable release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-packaging-smoke.yml@6c285dcd47f13919bb1af3be694bcc92c9f42356
    secrets: inherit
    with:
      continuum_ref: 6c285dcd47f13919bb1af3be694bcc92c9f42356
      mode: "${{ inputs.mode || 'both' }}"
      version: "${{ inputs.version || '' }}"
      native_prepare_command: 'bash scripts/build-rust-core.sh --release'
      static_archive_path: 'rust/target/release/libnanodictate_core.a'
