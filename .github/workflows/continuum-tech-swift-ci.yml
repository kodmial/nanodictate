name: CI

on:
  push:
    branches: [main]
    # A documentation-only merge does not need a macOS build on main.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-ci.yml@73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7
    secrets: inherit
    with:
      continuum_ref: '73976fd7c2e3336fe4c3f1dda1a79c74c01bd4d7'
