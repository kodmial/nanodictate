name: CI

on:
  push:
    branches: [main]
    # A documentation-only merge does not need a macOS build on main.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-ci.yml@v.0.0.2
    secrets: inherit
    with:
      continuum_ref: "v.0.0.2"
      native_prepare_command: "${{ vars.CONTINUUM_NATIVE_PREPARE_COMMAND || '' }}"
      static_archive_path: "${{ vars.CONTINUUM_STATIC_ARCHIVE_PATH || '' }}"
