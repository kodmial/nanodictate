name: CI

on:
  push:
    branches: [main]
    # A documentation-only merge does not need a macOS build on main.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-ci.yml@6c285dcd47f13919bb1af3be694bcc92c9f42356
    secrets: inherit
    with:
      continuum_ref: 6c285dcd47f13919bb1af3be694bcc92c9f42356
