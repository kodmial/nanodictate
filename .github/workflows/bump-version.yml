name: Bump version

# Auto-bump the patch version after a PR is merged into main — this closes the
# "merge -> bump -> release" chain: a merge whose PR did NOT bump
# Sources/NanoDictateCore/Version.swift gets the version bumped 0.0.N -> 0.0.(N+1)
# and the Release workflow is dispatched for the new version, so a release is
# created without any human action.
#
# If the PR DID bump the version already (Version.swift is ahead of the latest
# published release) this workflow is a green no-op — no double bump.
#
# No loop by construction: this workflow triggers ONLY on `pull_request` closed
# (not on `push`), so the bump commit it pushes to main cannot re-trigger it.
# The bump commit is pushed with the GITHUB_TOKEN, and GITHUB_TOKEN pushes do
# NOT start new push-event workflow runs — the Release workflow is therefore
# dispatched explicitly after the push (see the last step); that dispatch is
# what makes "merge -> bump -> release" complete automatically.
#
# Release policy — two independent gates, and every "do not release" answer is
# a GREEN no-op (nothing written, nothing pushed, no release dispatch):
#   1. `skip-release` label on the merged PR — a deliberate opt-out. Checked
#      FIRST, before the version comparison and before any diff is computed, so
#      a labeled PR is never bumped even if its paths would count as real
#      changes. The label is read from the pull_request event payload — no
#      extra API call. Documented in CONTRIBUTING.md.
#   2. Path-based guard — a diff limited to Version.swift, CHANGELOG.md,
#      README.md, SECURITY.md, LICENSE, docs/, .github/, .githooks/, the root
#      meta-dotfiles and packaging files would publish an empty release, so it
#      is classified non-releasable. The label does NOT replace this guard:
#      unlabeled PRs are classified exactly as before.
# Unrelated labels (chore, documentation, ci, ...) are deliberately NOT
# overloaded — the release decision stays explicit.
# Only a broken policy input (unparsable or out-of-series version) fails the
# workflow: a human error must be surfaced, not silently swallowed.
# The decisions themselves live in scripts/release-policy.sh and are covered by
# scripts/test-release-policy.sh (run by .github/workflows/ci.yml).
#
# Scope note: the merge ALSO triggers release.yml through its own `push` trigger.
# For a `skip-release` PR that is a no-op (the version is unchanged, so release.yml
# sees an already-published version and skips creation). A PR that both bumps
# Version.swift and carries `skip-release` would still publish its own version —
# see CONTRIBUTING.md.
#
# Automatic bump limit: automatic bumps in the 0.0.x series stop at 0.0.100.
# release.yml separately validates the selected version format and series.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  bump:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        # Same pinned actions/checkout as release.yml. Explicit main ref: the
        # default ref for a pull_request event is the merge ref, which is gone
        # once the PR is closed. fetch-depth: 0 + fetch-tags pull the full
        # history INCLUDING the previous release tag (v$LATEST): the "real
        # code changes" guard below diffs the merged HEAD against that tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # Everything that DECIDES whether a version is published happens here, so
      # the only step that can touch Version.swift, commit, push or dispatch is
      # the one gated on decision == 'releasable'.
      - name: Decide release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          # Labels straight from the event payload (github.event.pull_request
          # .labels) — no extra GitHub API request. Emitted through env, not
          # interpolated into the script, so the JSON needs no shell escaping.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh

          # --- Gate 1: the explicit `skip-release` opt-out -------------------
          # Deliberately first: before the version comparison, before any diff.
          if policy_pr_has_label "$PR_LABELS" skip-release; then
            echo "::notice::Merged PR #${PR_NUMBER} carries the 'skip-release' label — release automation is skipped: Version.swift is left untouched, nothing is committed or pushed, and the Release workflow is NOT dispatched."
            echo "decision=skip-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No 'skip-release' label on the merged PR — applying the automatic release policy."

          # Current version from the single source of truth (same extraction
          # as release.yml's preflight step).
          CURRENT=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' Sources/NanoDictateCore/Version.swift)
          echo "Version.swift: ${CURRENT:-<none>}"
          if [[ -z "$CURRENT" ]]; then
            echo "::error::Could not extract a version from Sources/NanoDictateCore/Version.swift"
            exit 1
          fi

          # Latest published release (release tags are v0.0.N; strip the v).
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' | sed 's/^v//')
          echo "Latest release: ${LATEST:-<none>}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [[ -z "$LATEST" ]]; then
            echo "::warning::No published release yet — the first release of the series is created manually (tag push); nothing to bump."
            echo "decision=no-release-yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strict version shape guard: only 0.0.x / 0.1.x (no leading zeros)
          # is accepted. Any other shape would either break the octal-prone
          # arithmetic of the bump (0.0.08) or be silently rewritten to the
          # 0.0.x series. Both versions are policy INPUTS here, so a failure is
          # a real error and fails the workflow.
          if ! policy_version_is_allowed "$CURRENT"; then
            echo "::error::Unexpected version in Version.swift: '$CURRENT' — expected 0.0.x or 0.1.x (no leading zeros)."
            exit 1
          fi
          if ! policy_version_is_allowed "$LATEST"; then
            echo "::error::Unexpected latest release tag: '$LATEST' — expected 0.0.x or 0.1.x (no leading zeros)."
            exit 1
          fi

          # Full semver order (sort -V): 0.1.0 ranks AHEAD of 0.0.99 even
          # though its patch part (0) is smaller — patch-only compares would
          # misrank across minor versions.
          EARLIEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n 1)

          if [[ "$CURRENT" != "$LATEST" && "$EARLIEST" == "$LATEST" ]]; then
            echo "Version.swift ($CURRENT) is already ahead of the latest release ($LATEST) — the PR bumped it manually, nothing to do."
            echo "decision=already-bumped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$CURRENT" != "$LATEST" && "$EARLIEST" == "$CURRENT" ]]; then
            echo "::warning::Version.swift ($CURRENT) is BEHIND the latest release ($LATEST) — refusing to touch it; bump the version in the PR."
            echo "decision=behind-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Gate 2: the path-based "real change" guard --------------------
          # Refuse to bump when the merged HEAD carries NO code change vs the
          # previous release tag (v$LATEST) — a diff limited to Version.swift,
          # CHANGELOG.md, README.md, SECURITY.md, LICENSE, docs/, .github/
          # (workflows, issue templates, PR template), .githooks/, the root
          # meta-dotfiles (.gitignore, .swift-format, .swiftlint.yml,
          # .coderabbit.yaml) and packaging files (formula / manifests / tpl /
          # config) would publish an empty release. User policy: the pipeline
          # must not self-release empty versions.
          #
          # The release workflow pins the installer to the just-synced macports
          # tree revision via a one-line PIN_REV edit to main after every tag.
          # That generated line is not a user code change — it is filtered out,
          # so a docs-only merge still refuses to bump, while a real installer
          # edit keeps counting.
          PREV_TAG="v$LATEST"
          ALL_CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD)
          NON_PINREV=$(git diff "$PREV_TAG"..HEAD -- "$POLICY_INSTALLER_PATH" \
            | policy_installer_diff_wo_pinrev)
          # policy_decide re-evaluates the label gate, which is harmless: it
          # already answered above and a labeled PR never reached this line.
          # Calling the same tested entry point the test suite exercises keeps
          # the workflow and the tests from drifting apart.
          DECISION=$(policy_decide "$PR_LABELS" "$ALL_CHANGED" "$NON_PINREV")
          case "$DECISION" in
            releasable)
              echo "Real changes since $PREV_TAG:"
              printf '%s\n' "$ALL_CHANGED" | policy_releasable_paths "$NON_PINREV" | sed 's/^/  /'
              ;;
            no-changes)
              echo "::warning::nothing changed since $PREV_TAG — no version to bump and no release to publish."
              ;;
            non-releasable)
              echo "::warning::no code changes — no bump and no release (only Version.swift / CHANGELOG.md / README.md / SECURITY.md / LICENSE / docs / .github / .githooks / repo meta files / packaging files changed since $PREV_TAG)."
              ;;
            *)
              echo "::error::policy_decide returned an unknown decision: '$DECISION'"
              exit 1
              ;;
          esac
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"

          # --- Automatic bump limit ------------------------------------------
          # Equal versions here: the merged PR did NOT bump the version, so
          # this workflow bumps it — unless the 0.0.x series already hit its
          # hard cap. The limit applies ONLY to the 0.0.x series: 0.1.x may
          # grow past patch=100 (0.1.101 is fine), so it is gated on the "0.0."
          # prefix. Checked here, not in the bump step, so a capped version is
          # a decision (and stays a green no-op) instead of a half-applied bump.
          if policy_automatic_bump_blocked "$CURRENT"; then
            echo "::warning::Version $CURRENT is the 0.0.100 hard cap of the 0.0.x series (user policy) — refusing to bump to 0.0.101. A future series (e.g. 0.1.x) requires a manual version change."
            echo "decision=at-cap" >> "$GITHUB_OUTPUT"
          fi

      # The only step that mutates the repository or dispatches a release.
      - name: Bump patch version
        id: bump
        if: steps.policy.outputs.decision == 'releasable'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.policy.outputs.current }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh

          # Preserve the current major.minor prefix: 0.1.12 must bump to
          # 0.1.13, never be rewritten into the 0.0.x series.
          NEW=$(policy_next_version "$CURRENT")
          sed -i.bak -E "s/(let string = \")[0-9]+\.[0-9]+\.[0-9]+(\")/\1$NEW\2/" Sources/NanoDictateCore/Version.swift
          rm -f Sources/NanoDictateCore/Version.swift.bak
          if ! grep -q "let string = \"$NEW\"" Sources/NanoDictateCore/Version.swift; then
            echo "::error::Failed to rewrite Sources/NanoDictateCore/Version.swift to $NEW"
            exit 1
          fi
          echo "Bumped Sources/NanoDictateCore/Version.swift: $CURRENT -> $NEW"

          git config user.name "kodmial"
          git config user.email "kodmial@gmail.com"
          git add Sources/NanoDictateCore/Version.swift
          git commit -m "chore(version): bump v$NEW"
          git push origin main

          # The push above is a GITHUB_TOKEN push and therefore does NOT
          # trigger the push-main Release workflow run (GitHub's documented
          # GITHUB_TOKEN event suppression). Dispatch the Release workflow
          # explicitly so "merge -> bump -> release" completes without human
          # action: the merged PR's own push already ran Release for the OLD
          # version (a green no-op when it was already published); this
          # dispatch is what releases the NEW version, which Release derives
          # from Version.swift on the default branch.
          gh workflow run release.yml
          echo "Dispatched the Release workflow — it will publish v$NEW."
          echo "new_version=${NEW}" >> "$GITHUB_OUTPUT"

      # One place that spells out what happened, so a no-op merge is not
      # mistaken for a broken pipeline.
      - name: Release policy summary
        # hashFiles guard: if the checkout itself failed there is no script to
        # source, and a second red step would only hide the real failure.
        if: always() && hashFiles('scripts/release-policy.sh') != ''
        env:
          DECISION: ${{ steps.policy.outputs.decision }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh
          {
            echo "### Bump version — PR #${PR_NUMBER}"
            echo
            case "${DECISION:-}" in
              skip-release)
                echo "Labels: \`$(policy_label_names "$PR_LABELS" | tr '\n' ' ' | sed -e 's/[[:space:]]*$//')\`"
                echo
                echo "**Release automation skipped** — this PR carries the \`skip-release\` label."
                echo "Version.swift unchanged, nothing committed or pushed, the Release workflow was not dispatched."
                ;;
              releasable)
                echo "Bumped Version.swift and dispatched the Release workflow for **v${NEW_VERSION}**."
                ;;
              no-changes)
                echo "Green no-op — nothing changed since the latest release tag."
                ;;
              non-releasable)
                echo "Green no-op — only non-releasable paths changed (docs, .github, packaging, meta files); the path-based guard refused to publish an empty release."
                ;;
              already-bumped)
                echo "Green no-op — the PR bumped Version.swift itself; no double bump."
                ;;
              behind-release)
                echo "Green no-op — Version.swift is behind the latest release; the version must be bumped in a PR."
                ;;
              no-release-yet)
                echo "Green no-op — no release is published yet; the first release is created manually."
                ;;
              at-cap)
                echo "Green no-op — the 0.0.x series reached its 0.0.100 automatic-bump cap."
                ;;
              *)
                echo "No decision was recorded (the run failed before the policy step finished)."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
