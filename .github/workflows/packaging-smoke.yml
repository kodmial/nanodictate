name: Packaging smoke

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - 'rust/**'
      - '.github/workflows/packaging-smoke.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - 'rust/**'
      - '.github/workflows/packaging-smoke.yml'
      - '.github/workflows/release.yml'
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  schedule:
    # Non-round daily canary time (03:17 UTC), not the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which smoke mode to run'
        required: false
        type: choice
        default: both
        options:
          - both
          - candidate
          - production
      version:
        description: 'Production version to verify (e.g. 0.1.7). Empty = latest stable release.'
        required: false
        type: string
        default: ''

# Mirrors the union of the callee's real API surface: the resolve job reads PR
# files and cancels superseded runs, the production-incident job writes issues.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

# Packaging macOS runners are scarce, so collapse repeated candidate runs for
# the same PR/ref before they can queue. Production verification
# (workflow_run post-publish, schedule canary, manual workflow_dispatch) must
# never cancel a run that is already verifying the public channels: each
# production run carries its own run_id so overlapping Release completions
# queue/run independently instead of superseding each other (issue #172: run
# 485 was cancelled by run 487 and the cancelled legs filed a false P0).
# Gating here rather than in the callee is what actually frees the runner
# slots. The group name stays Continuum's own, so a shipped stub never carries
# a consumer's product name; the repository part keeps the group unambiguous
# in the Actions UI.
concurrency:
  group: continuum-swift-packaging-smoke-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_run' && github.run_id) || (github.event_name == 'schedule' && github.run_id) || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/nanodictate-packaging-smoke-engine.yml
    secrets: inherit
    with:
      continuum_ref: main
      native_prepare_command: "${{ vars.CONTINUUM_NATIVE_PREPARE_COMMAND || 'bash scripts/build-rust-core.sh --release' }}"
      static_archive_path: "${{ vars.CONTINUUM_STATIC_ARCHIVE_PATH || 'rust/target/release/libnanodictate_core.a' }}"
      mode: "${{ inputs.mode || 'both' }}"
      version: "${{ inputs.version || '' }}"
