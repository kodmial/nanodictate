name: Merge trusted release automation PRs

on:
  workflow_run:
    # Release PRs contain only version/changelog metadata and are validated by
    # the Release notes gate. Manifest PRs still use full CI. Either completion
    # wakes the same exact-head trusted merger.
    workflows: ["CI", "Release notes"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    uses: ./.github/workflows/nanodictate-release-automation-merge-engine.yml
    secrets: inherit
    with:
      continuum_ref: main
