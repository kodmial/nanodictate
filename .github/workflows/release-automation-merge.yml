name: Merge trusted release automation PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    uses: ./.github/workflows/nanodictate-release-automation-merge-engine.yml
    secrets: inherit
    with:
      continuum_ref: main
