name: Set runtime-lab automation limits

on:
  push:
    paths:
      - '.github/workflows/runtime-lab-set-limits-temp.yml'

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Set repository variables
        shell: bash
        run: |
          set -euo pipefail
          set_var() {
            local name="$1" value="$2"
            if gh api "repos/kodmial/runtime-lab/actions/variables/$name" >/dev/null 2>&1; then
              printf '{"name":"%s","value":"%s"}' "$name" "$value" |                 gh api --method PATCH "repos/kodmial/runtime-lab/actions/variables/$name" --input - >/dev/null
            else
              printf '{"name":"%s","value":"%s"}' "$name" "$value" |                 gh api --method POST "repos/kodmial/runtime-lab/actions/variables" --input - >/dev/null
            fi
          }

          set_var AUTOMATION_WIP_LIMIT 4
          set_var AUTOMATION_MAX_DISPATCH_ATTEMPTS 4

          gh api repos/kodmial/runtime-lab/actions/variables             --jq '.variables[] | select(.name=="AUTOMATION_WIP_LIMIT" or .name=="AUTOMATION_MAX_DISPATCH_ATTEMPTS") | [.name,.value] | @tsv'
