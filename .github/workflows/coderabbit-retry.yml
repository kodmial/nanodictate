name: Retry CodeRabbit after rate limit

on:
  schedule:
    # GitHub's minimum schedule interval is 5 minutes. Avoid minute 0, where
    # scheduled workflows are more likely to be delayed under high load.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: coderabbit-rate-limit-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry due CodeRabbit reviews
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();

            function parseRetryDelayMs(body = '') {
              const match = body.match(
                /Next included review available in\s+([^\n<.]+)/i
              );
              if (!match) {
                // CodeRabbit sometimes returns only "Review rate limited"
                // without a countdown. Never let such a PR get stuck forever:
                // use a conservative fallback beyond the hourly included-review cadence.
                if (/Review rate limited|Review limit reached/i.test(body)) {
                  return 65 * 60_000;
                }
                return null;
              }

              if (/less than\s+(?:a|one)\s+minute/i.test(match[1])) {
                return 60_000;
              }

              let totalMs = 0;
              let found = false;
              const parts = match[1].matchAll(
                /(\d+)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)/gi
              );

              for (const part of parts) {
                found = true;
                const value = Number(part[1]);
                const unit = part[2].toLowerCase();

                if (unit.startsWith('hour') || unit.startsWith('hr')) {
                  totalMs += value * 60 * 60_000;
                } else if (unit.startsWith('minute') || unit.startsWith('min')) {
                  totalMs += value * 60_000;
                } else {
                  totalMs += value * 1_000;
                }
              }

              return found ? totalMs : null;
            }

            function hasReviewReadyLabel(pr) {
              return (pr.labels || []).some(label => label.name === 'review-ready');
            }

            function findLatestRateLimit(comments) {
              return comments
                .filter(c => c.user?.login === 'coderabbitai[bot]')
                .map(c => {
                  const delayMs = parseRetryDelayMs(c.body || '');
                  return delayMs === null ? null : { comment: c, delayMs };
                })
                .filter(Boolean)
                .sort(
                  (a, b) =>
                    new Date(b.comment.updated_at).getTime() -
                    new Date(a.comment.updated_at).getTime()
                )[0];
            }

            function stateMovedPastRateLimit(comments, limitedAt) {
              const retryAlreadyPosted = comments.some(c =>
                c.user?.login !== 'coderabbitai[bot]' &&
                /^@coderabbitai\s+(?:full\s+)?review\s*$/i.test(c.body?.trim() || '') &&
                new Date(c.created_at).getTime() > limitedAt
              );
              if (retryAlreadyPosted) return true;

              return comments.some(c =>
                c.user?.login === 'coderabbitai[bot]' &&
                new Date(c.updated_at).getTime() > limitedAt &&
                !/Review rate limited|Review limit reached|Next included review available/i.test(
                  c.body || ''
                )
              );
            }

            async function currentHeadHasGreenCi(pr) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  branch: pr.head.ref,
                  event: 'pull_request',
                  per_page: 100,
                }
              );

              const currentHeadCi = runs
                .filter(run => run.name === 'CI' && run.head_sha === pr.head.sha)
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() -
                    new Date(a.created_at).getTime()
                )[0];

              return Boolean(
                currentHeadCi &&
                currentHeadCi.status === 'completed' &&
                currentHeadCi.conclusion === 'success'
              );
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const pr of pulls) {
              if (pr.draft) continue;

              // Never request a review while a synchronize/update is still being
              // validated. remove-review-label.yml clears review-ready on every
              // new head; add-review-label.yml restores it only after CI succeeds
              // for that exact head SHA.
              if (!hasReviewReadyLabel(pr)) {
                core.info(
                  `PR #${pr.number}: review-ready is absent; waiting for current-head CI.`
                );
                continue;
              }

              if (!(await currentHeadHasGreenCi(pr))) {
                core.info(
                  `PR #${pr.number}: review-ready exists but no successful CI was found for head ${pr.head.sha}; refusing to retry.`
                );
                continue;
              }

              let comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });

              const limited = findLatestRateLimit(comments);
              if (!limited) continue;

              const limitedAt = new Date(limited.comment.updated_at).getTime();
              // Small safety margin prevents a retry from landing a few seconds
              // before CodeRabbit's own quota clock has actually reset.
              const dueAt = limitedAt + limited.delayMs + 30_000;
              if (now < dueAt) continue;

              if (stateMovedPastRateLimit(comments, limitedAt)) continue;

              // Re-read both PR metadata and comments immediately before writing
              // the command. This closes the race where main/HEAD changes after
              // the first checks but before the review command is posted.
              const { data: freshPr } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });

              if (
                freshPr.state !== 'open' ||
                freshPr.draft ||
                freshPr.head.sha !== pr.head.sha ||
                !hasReviewReadyLabel(freshPr)
              ) {
                core.info(
                  `PR #${pr.number}: PR/head/readiness changed during evaluation; retry cancelled.`
                );
                continue;
              }

              if (!(await currentHeadHasGreenCi(freshPr))) {
                core.info(
                  `PR #${pr.number}: current head lost green-CI eligibility; retry cancelled.`
                );
                continue;
              }

              comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });

              const freshLimited = findLatestRateLimit(comments);
              if (
                !freshLimited ||
                freshLimited.comment.id !== limited.comment.id ||
                freshLimited.comment.updated_at !== limited.comment.updated_at
              ) {
                core.info(
                  `PR #${pr.number}: CodeRabbit rate-limit state changed; retry cancelled.`
                );
                continue;
              }

              if (stateMovedPastRateLimit(comments, limitedAt)) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: '@coderabbitai full review',
              });
              core.notice(
                `Retried full CodeRabbit review for PR #${pr.number} after quota reset, current-head CI success, and readiness revalidation.`
              );
            }
