name: mark-ready-for-coderabbit

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            // 'workflow_run' exposes run.head_branch = the BASE branch of the PR (e.g. "main"),
            // not the PR head ref, and the REST 'head' param requires the strict "owner:ref"
            // format. Passing a bare branch there never matches, so the list came back empty and
            // no label was ever applied. List every open PR (no 'head' filter) and select the
            // right ones in JS: same-repo head + non-draft.
            const ours = prs.data.filter((pr) =>
              !pr.draft &&
              pr.head.repo.full_name === context.repo.full_name
            );
            if (run.conclusion === 'success') {
              for (const pr of ours) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['review-ready'],
                });
              }
            } else {
              for (const pr of ours) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: 'review-ready',
                  });
                } catch (err) {
                  // label absent, nothing to remove
                }
              }
            }
