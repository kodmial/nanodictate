name: mark-ready-for-coderabbit

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            // Match only the non-draft PR whose current head is the exact commit
            // that CI just tested, and only when the PR branch is in this repository.
            const ours = prs.data.filter((pr) =>
              !pr.draft &&
              pr.head.sha === run.head_sha &&
              pr.head.repo.full_name === repoFullName
            );

            console.log(`Matched ${ours.length} open PR(s) for CI head ${run.head_sha}`);

            if (run.conclusion === 'success') {
              for (const pr of ours) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['review-ready'],
                });
                console.log(`Added review-ready to #${pr.number}`);

                // CodeRabbit disables native automatic reviews for some OSS repositories
                // (for example, low-star repositories). A PR command still requests a
                // normal CodeRabbit review, so post it automatically after green CI.
                // The hidden SHA marker makes CI reruns idempotent.
                const marker = `<!-- coderabbit-auto-review:${run.head_sha} -->`;
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100,
                  }
                );

                if (!comments.some((comment) => comment.body?.includes(marker))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `@coderabbitai review\n\n${marker}`,
                  });
                  console.log(`Requested CodeRabbit review for #${pr.number}`);
                } else {
                  console.log(`CodeRabbit review already requested for #${pr.number} at ${run.head_sha}`);
                }
              }
            } else {
              for (const pr of ours) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: 'review-ready',
                  });
                  console.log(`Removed review-ready from #${pr.number}`);
                } catch (err) {
                  if (err.status === 404) {
                    console.log(`No review-ready label on #${pr.number} (nothing to remove)`);
                  } else {
                    throw err;
                  }
                }
              }
            }
