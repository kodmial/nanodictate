name: mark-ready-for-coderabbit

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  add-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const run = context.payload.workflow_run;
            const REQUESTED_LABEL = 'coderabbit-review-requested';

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            // Match only a non-draft same-repository PR whose current head is
            // exactly the commit tested by this completed CI run.
            const ours = prs.filter((pr) =>
              !pr.draft &&
              pr.head.sha === run.head_sha &&
              pr.head.repo.full_name === repoFullName
            );

            core.info(
              `Matched ${ours.length} open same-repository PR(s) for CI head ${run.head_sha}.`
            );

            if (run.conclusion !== 'success') {
              for (const pr of ours) {
                for (const name of ['review-ready', REQUESTED_LABEL]) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: pr.number,
                      name,
                    });
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }
              return;
            }

            // A visible lock label makes the request idempotent across workflow
            // reruns for the same head. It is removed on every PR synchronize.
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: REQUESTED_LABEL,
                color: 'C5DEF5',
                description: 'CodeRabbit review already requested for the current PR head.',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // already exists
            }

            for (const pr of ours) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ['review-ready'],
              });

              const labels = await github.paginate(
                github.rest.issues.listLabelsOnIssue,
                {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                }
              );

              if (labels.some(label => label.name === REQUESTED_LABEL)) {
                core.info(
                  `PR #${pr.number}: CodeRabbit review was already requested for head ${pr.head.sha}.`
                );
                continue;
              }

              // A review that happened before CI is intentionally NOT enough:
              // auto-merge requires a completed CodeRabbit review after the exact
              // current-head CI run. Only suppress the request if that stronger
              // condition is already true (for example after a manual post-CI run).
              const { data: combinedStatus } =
                await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                });

              const latestRabbitStatus = (combinedStatus.statuses || [])
                .filter(status => status.context === 'CodeRabbit')
                .sort(
                  (a, b) =>
                    new Date(b.updated_at || b.created_at).getTime() -
                    new Date(a.updated_at || a.created_at).getTime()
                )[0] || null;

              const ciCompletedAt = new Date(
                run.updated_at || run.created_at
              ).getTime();
              const rabbitCompletedAt = latestRabbitStatus
                ? new Date(
                    latestRabbitStatus.updated_at ||
                    latestRabbitStatus.created_at
                  ).getTime()
                : 0;

              const alreadyReviewedAfterCi = Boolean(
                latestRabbitStatus &&
                latestRabbitStatus.state === 'success' &&
                /Review completed/i.test(
                  latestRabbitStatus.description || ''
                ) &&
                rabbitCompletedAt >= ciCompletedAt
              );

              if (alreadyReviewedAfterCi) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [REQUESTED_LABEL],
                });
                core.info(
                  `PR #${pr.number}: current head ${pr.head.sha} already has a completed post-CI CodeRabbit review.`
                );
                continue;
              }

              // Acquire the lock before posting the command so concurrent/re-run
              // workflow executions cannot create duplicate review requests.
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [REQUESTED_LABEL],
              });

              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: '@coderabbitai full review',
                });
                core.notice(
                  `Requested full CodeRabbit review for PR #${pr.number} at green head ${pr.head.sha}.`
                );
              } catch (err) {
                // A failed post must not permanently suppress the next workflow
                // attempt for this unchanged head.
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: REQUESTED_LABEL,
                  });
                } catch (_) {}
                throw err;
              }
            }
