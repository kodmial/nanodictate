name: Bootstrap repository

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  create:
    if: github.event.issue.title == '[bootstrap] create runtime-lab'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Create public repository
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/kodmial/runtime-lab >/dev/null 2>&1 && exit 0
          gh api --method POST user/repos \
            -f name='runtime-lab' \
            -F private=false \
            -F has_issues=true \
            -F has_projects=false \
            -F has_wiki=false \
            -F auto_init=true
