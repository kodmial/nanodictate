name: Wire runtime-lab Render smoke dependencies

on:
  push:
    paths:
      - '.github/workflows/runtime-lab-deps-temp.yml'

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Add native issue dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          add_blocker() {
            local issue="$1" blocker_id="$2"
            printf '{"issue_id":%s}' "$blocker_id" | \
              gh api --method POST \
                "repos/kodmial/runtime-lab/issues/$issue/dependencies/blocked_by" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                --input - >/dev/null 2>&1 || true
          }

          # #9 blocked by #3 and #4.
          add_blocker 9 5608547647
          add_blocker 9 5608547951

          # #5 also waits for the real Render smoke test #9.
          add_blocker 5 5608741195
