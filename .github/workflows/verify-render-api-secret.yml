name: Verify Render API secret

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'ci: probe Render API secret'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify Render API
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY_MISSING"
            exit 2
          fi

          code=$(curl -sS -o /tmp/owners.json -w '%{http_code}' \
            'https://api.render.com/v1/owners?limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "OWNERS_HTTP_STATUS=$code"
          test "$code" = "200"

          echo "WORKSPACES_BEGIN"
          jq -c '.[] | (.owner // .) | {id:(.id // .ownerId // .owner_id),name:(.name // null),email:(.email // null),type:(.type // null)}' /tmp/owners.json
          echo "WORKSPACES_END"

          code=$(curl -sS -o /tmp/services.json -w '%{http_code}' \
            'https://api.render.com/v1/services?limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "SERVICES_HTTP_STATUS=$code"
          test "$code" = "200"

          echo "SERVICES_BEGIN"
          jq -c '.[] | (.service // .) | {id:(.id // null),name:(.name // null),type:(.type // null),ownerId:(.ownerId // .owner_id // null),suspended:(.suspended // null)}' /tmp/services.json
          echo "SERVICES_END"
