name: Retry CodeRabbit after rate limit

on:
  # Any new/edited CodeRabbit rate-limit response wakes the global controller.
  issue_comment:
    types: [created, edited]

  # A completed CodeRabbit review consumes the shared included-review quota.
  # Wake the controller so it can move the next queued PR behind the global
  # cooldown instead of immediately burning another retry.
  pull_request_review:
    types: [submitted]

  # CodeRabbit finding replies are lifecycle transitions too. Wake the
  # serialized queue immediately instead of relying on cron or unrelated events.
  pull_request_review_comment:
    types: [created, edited]

  # Manual/safety-net reconciliation. The reusable controller is non-blocking: quota backoff is durable and never sleeps a runner.
  workflow_dispatch:

permissions:
  # The review queue only reads Actions state; exact-finding verification is
  # owned by the separate auto-merge reconciler.
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-coderabbit-retry.yml@main
    secrets: inherit
    with:
      continuum_ref: main
