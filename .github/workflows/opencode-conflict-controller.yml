name: OpenCode conflict controller

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  reconcile-opencode-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile OpenCode pull requests with main
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail

          ensure_lock_label() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name='opencode-conflict-repair' \
              -f color='B60205' \
              -f description='OpenCode conflict repair is in progress' \
              >/dev/null 2>&1 || true
          }

          dispatch_conflict_repair() {
            local pr_number="$1"
            local head_ref="$2"

            local labels
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}" --jq '.labels[].name')"
            if grep -Fxq 'opencode-conflict-repair' <<<"$labels"; then
              echo "PR #${pr_number}: conflict repair is already in progress."
              return
            fi

            ensure_lock_label
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
              -f 'labels[]=opencode-conflict-repair' \
              >/dev/null

            echo "PR #${pr_number}: merge conflict detected; dispatching OpenCode."
            if ! gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/opencode.yml/dispatches" \
              -f ref=main \
              -f 'inputs[mode]=resolve-conflict' \
              -f "inputs[pr_number]=${pr_number}" \
              -f "inputs[head_ref]=${head_ref}"; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/opencode-conflict-repair" \
                >/dev/null 2>&1 || true
              return 1
            fi
          }

          reconcile_pr() {
            local pr_number="$1"
            local data head_ref head_repo base_ref head_sha mergeable state

            data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            head_ref="$(jq -r '.head.ref' <<<"$data")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$data")"
            base_ref="$(jq -r '.base.ref' <<<"$data")"

            if [[ "$base_ref" != "main" ||
                  "$head_repo" != "$GITHUB_REPOSITORY" ||
                  "$head_ref" != opencode/* ]]; then
              echo "PR #${pr_number}: not an eligible same-repository OpenCode PR; skipping."
              return
            fi

            # GitHub computes mergeability asynchronously. Give it a short,
            # bounded window before deciding whether an agent is required.
            for _ in 1 2 3 4 5 6; do
              data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
              mergeable="$(jq -r '.mergeable' <<<"$data")"
              state="$(jq -r '.mergeable_state // "unknown"' <<<"$data")"
              [[ "$mergeable" != "null" && "$state" != "unknown" ]] && break
              sleep 2
            done

            head_sha="$(jq -r '.head.sha' <<<"$data")"
            head_ref="$(jq -r '.head.ref' <<<"$data")"
            state="$(jq -r '.mergeable_state // "unknown"' <<<"$data")"

            if [[ "$state" == "dirty" ]]; then
              dispatch_conflict_repair "$pr_number" "$head_ref"
              return
            fi

            # Let GitHub perform the cheap deterministic update first. Using
            # TAP_PAT (not github.token) ensures the resulting synchronize
            # event can start the normal PR workflows.
            set +e
            update_output="$(gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/update-branch" \
              -f "expected_head_sha=${head_sha}" 2>&1)"
            update_rc=$?
            set -e

            if [[ $update_rc -eq 0 ]]; then
              echo "PR #${pr_number}: branch updated from main by GitHub."
              return
            fi

            # A 422 is also returned when no update is necessary. Re-read the
            # PR and dispatch the agent only when GitHub now reports a conflict.
            data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            state="$(jq -r '.mergeable_state // "unknown"' <<<"$data")"
            if [[ "$state" == "dirty" ]]; then
              dispatch_conflict_repair "$pr_number" "$head_ref"
            else
              echo "PR #${pr_number}: no conflict repair required (state=${state})."
            fi
          }

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
            reconcile_pr "$pr_number"
          else
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | select(.head.ref | startswith("opencode/")) | .number' \
              | while read -r pr_number; do
                  [[ -n "$pr_number" ]] && reconcile_pr "$pr_number"
                done
          fi
